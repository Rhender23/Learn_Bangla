<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bangla Speak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14231C;--mut:#5E6B64;--ln:#DCE3DE;--bg:#F3F6F4;--card:#FFFFFF;
  --g:#0B6E4F;--gd:#08533B;--gl:#E3F1EA;--river:#CFE5D8;--riverdone:#8FC3A8;
  --r:#D9434B;--rl:#FBE9EA;--gold:#C9922E;--goldl:#F7EBD3;--pur:#5B4BB7;--purl:#ECE9FA;
  --sh:0 1px 2px rgba(20,35,28,.06),0 4px 14px rgba(20,35,28,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:150px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}
:focus-visible{outline:3px solid #7FB89C;outline-offset:2px}

/* header */
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln)}
header .in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
header .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.06em;letter-spacing:-.01em;margin-right:auto;color:var(--ink)}
header .mark{width:26px;height:26px;border-radius:7px;background:var(--g);position:relative;flex:none}
header .mark::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:var(--r);left:6px;top:7px}
header nav{display:flex;background:#EEF2EF;border-radius:11px;padding:3px}
header nav button{background:none;color:var(--mut);padding:7px 14px;border-radius:9px;font-weight:600;font-size:.92em}
header nav button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
body.insession header nav{display:none}
main{max-width:680px;margin:0 auto;padding:18px 16px}
h2{margin:22px 0 10px;font-size:1.2em;letter-spacing:-.01em}

/* buttons */
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 18px;cursor:pointer;background:var(--g);color:#fff;transition:transform .08s,background .15s}
button:active:not(:disabled){transform:scale(.97)}
button.alt{background:#EAF0EC;color:var(--ink)}
button.ghost{background:transparent;color:var(--g);border:1.5px solid #BCD9C9}
button.link{background:none;color:var(--mut);padding:6px 4px;text-decoration:underline;font-weight:500}
button:disabled{background:#D3DBD6;color:#fff;cursor:default}
.card{background:var(--card);border-radius:16px;padding:16px 18px;margin:12px 0;box-shadow:var(--sh)}
.banner{border-radius:12px;padding:12px 14px;margin:10px 0;font-size:.93em}
.banner.warn{background:var(--goldl)}.banner.err{background:var(--rl)}.banner ul{margin:6px 0 0;padding-left:20px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sub{color:var(--mut)}
.center{text-align:center}

/* daily goal */
.goal{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.goal .ring{flex:none}
.goal .txt{flex:1;min-width:0}
.goal .txt b{display:block;font-size:1.02em}
.week{display:flex;justify-content:space-between;width:100%;padding-top:12px;border-top:1px solid #EDF1EE}
.week span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.7em;color:var(--mut);font-weight:600}
.week i{width:12px;height:12px;border-radius:50%;background:#E5ECE8;display:block}
.week i.p{background:var(--riverdone)}.week i.m{background:var(--g)}
.week span.today{color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cal i{aspect-ratio:1;border-radius:6px;background:#E9EFEB;display:block}
.cal i.p{background:var(--riverdone)}.cal i.m{background:var(--g)}.cal i.t{outline:2px solid var(--ink);outline-offset:1px}
.seg{display:flex;background:#EEF2EF;border-radius:11px;padding:3px;gap:2px}
.seg button{background:none;color:var(--mut);padding:7px 11px;border-radius:9px;font-weight:600;font-size:.9em}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}

/* sections & units */
.sec{scroll-margin-top:70px;background:var(--g);color:#fff;border-radius:18px;padding:16px 18px;margin:22px 0 8px;cursor:pointer;position:relative;overflow:hidden}
.sec::after{content:"";position:absolute;right:-26px;top:-26px;width:96px;height:96px;border-radius:50%;background:var(--r);opacity:.9}
.sec.locked{background:#8C9A93}.sec.locked::after{background:#A9B4AE;opacity:1}
.sec h2{margin:0;font-size:1.12em;position:relative;z-index:1;padding-right:70px}
.sec p{margin:4px 0 0;opacity:.88;font-size:.9em;position:relative;z-index:1;padding-right:70px}
.sec .meter{height:6px;background:rgba(255,255,255,.25);border-radius:4px;margin-top:12px;position:relative;z-index:1;overflow:hidden}
.sec .meter div{height:100%;background:#fff;border-radius:4px}
.unit{background:var(--card);border-radius:16px;padding:14px 16px;margin-top:22px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:var(--sh);border-left:6px solid var(--g)}
.unit h3{margin:0;font-size:1.04em}.unit p{margin:2px 0 0;font-size:.88em;color:var(--mut)}
.unit.locked{border-left-color:#B7C2BC}.unit.locked h3{color:var(--mut)}
.unit button{white-space:nowrap;padding:8px 14px;font-size:.88em}

/* the river path */
.path{position:relative;margin:6px auto 0}
.path svg.river{position:absolute;left:50%;top:0;transform:translateX(-50%);overflow:visible;pointer-events:none}
.stop{position:absolute;width:140px;margin-left:-70px;display:flex;flex-direction:column;align-items:center;gap:10px}
.node{width:64px;height:64px;border-radius:50%;padding:0;display:grid;place-items:center;background:var(--g);box-shadow:0 5px 0 var(--gd);position:relative}
.node svg{width:28px;height:28px;fill:#fff}
.node.done{background:var(--gold);box-shadow:0 5px 0 #A3741F}
.node.story{background:#2F7D9C;box-shadow:0 5px 0 #235E75}
.node.review{background:var(--ink);box-shadow:0 5px 0 #000}
.node.legend{background:var(--pur);box-shadow:0 5px 0 #43378A}.node.legend.done{background:#3A2E80;box-shadow:0 5px 0 #261E57}
.node:disabled{background:#D3DBD6;box-shadow:0 5px 0 #B8C3BC}
.node:disabled svg{fill:#8E9C95}
.node.cur::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid var(--g);opacity:.35;animation:ring 2.2s ease-in-out infinite}
@keyframes ring{50%{transform:scale(1.08);opacity:.12}}
.stop .lbl{font-size:.78em;font-weight:600;color:var(--mut);text-align:center;line-height:1.2;background:var(--bg);padding:2px 8px;border-radius:8px;position:relative;z-index:1}
.stop .lbl.cur{color:var(--ink)}

/* exercise screen */
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.top>button{padding:8px 12px}
.bar{flex:1;height:12px;background:#E1E8E4;border-radius:8px;overflow:hidden}
.bar>div{height:100%;background:var(--g);border-radius:8px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.kind{font-size:.85em;font-weight:700;color:var(--pur)}
.prompt{font-size:1.25em;font-weight:700;margin:6px 0 14px;letter-spacing:-.01em}
.phrase{font-size:1.6em;font-weight:800;margin:6px 0;letter-spacing:-.01em}
.audio{display:flex;gap:10px;margin:10px 0 18px}.audio button{font-size:1.25em;padding:12px 18px}
.opt{display:block;width:100%;text-align:left;margin:9px 0;background:var(--card);color:var(--ink);border:2px solid var(--ln);box-shadow:0 3px 0 var(--ln);font-weight:600}
.opt .n{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border:1.5px solid var(--ln);border-radius:6px;color:var(--mut);font-weight:600;font-size:.8em;margin-right:8px}
.opt.sel{border-color:var(--g);background:var(--gl);box-shadow:0 3px 0 #9CCBB2}
.opt.ok{border-color:var(--g);background:var(--gl);box-shadow:0 3px 0 #9CCBB2}
.opt.bad{border-color:var(--r);background:var(--rl);box-shadow:0 3px 0 #EFB3B6}
.opt:disabled{background:var(--card);color:var(--ink)}
.opt.ok:disabled{background:var(--gl)}.opt.bad:disabled{background:var(--rl)}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs>div{display:flex;flex-direction:column;gap:10px}
.pairs .opt{margin:0;text-align:center}
.pairs .opt.gone{visibility:hidden}
.answer{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;padding:8px 0;border-bottom:2px solid var(--ln);margin-bottom:18px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{background:var(--card);color:var(--ink);border:2px solid var(--ln);box-shadow:0 3px 0 var(--ln);padding:8px 14px;font-weight:600}
.tile.used{visibility:hidden}
.tile:disabled{background:var(--card);color:var(--ink)}
.blank{display:inline-block;min-width:3.5em;border-bottom:3px solid var(--g);text-align:center}
input.type{width:100%;font:inherit;font-size:1.12em;padding:14px;border:2px solid var(--ln);border-radius:12px;background:#fff}
input.type:focus{outline:none;border-color:var(--g)}
.mic{display:block;margin:14px auto 6px;width:96px;height:96px;border-radius:50%;font-size:2.2em;padding:0}
.mic.on{background:var(--r);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.w{border-bottom:2px dotted #9AAAA2;cursor:pointer}
#tip{position:absolute;z-index:30;background:var(--ink);color:#fff;padding:6px 10px;border-radius:8px;font-size:.9rem;display:none;max-width:240px}

/* bottom sheet */
#sheet:empty{display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--ln);padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
.sheet.ok{background:var(--gl);border-color:#BFE0CD;animation:up .22s ease-out}
.sheet.bad{background:var(--rl);border-color:#F2C4C7;animation:up .22s ease-out}
.sheet .in{max-width:680px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sheet .msg{flex:1;min-width:180px}
.sheet h4{margin:0 0 4px;font-size:1.1em}
.sheet.ok h4{color:var(--gd)}.sheet.bad h4{color:var(--r)}

/* stories */
.chat{display:flex;flex-direction:column}
.bub{max-width:85%;padding:11px 14px;border-radius:16px 16px 16px 4px;margin:6px 0;background:var(--card);box-shadow:var(--sh);cursor:pointer}
.bub.b{align-self:flex-end;background:var(--gl);border-radius:16px 16px 4px 16px}
.bub .who{font-size:.76em;font-weight:700;color:var(--mut)}
.bub .en{font-size:.88em;color:var(--mut);margin-top:3px}

/* lesson summary */
.done-head{text-align:center;padding:10px 0 4px}
.done-icon{width:84px;height:84px;border-radius:50%;background:var(--gold);display:grid;place-items:center;margin:0 auto 12px;box-shadow:0 6px 0 #A3741F}
.done-icon svg{width:40px;height:40px;fill:#fff}
.done-icon.legend{background:var(--pur);box-shadow:0 6px 0 #43378A}
.done-icon.story{background:#2F7D9C;box-shadow:0 6px 0 #235E75}
.done-icon.soft{background:#8C9A93;box-shadow:0 6px 0 #6E7B74}
.done-head h2{margin:0;font-size:1.45em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 6px}
.stats div{background:var(--card);border-radius:14px;padding:12px;text-align:center;box-shadow:var(--sh)}
.stats b{display:block;font-size:1.35em;letter-spacing:-.01em}
.stats span{font-size:.8em;color:var(--mut);font-weight:600}
.goalmsg{display:flex;align-items:center;gap:10px;background:var(--gl);border-radius:12px;padding:10px 14px;margin:12px 0;font-weight:600;color:var(--gd)}

/* inline icons */
button svg{width:20px;height:20px;fill:currentColor;vertical-align:-4px}
.mic svg{width:40px;height:40px;fill:#fff}
.audio button{display:inline-flex;align-items:center;gap:6px}
.hearts{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--r)}.hearts svg{width:20px;height:20px;fill:var(--r)}
/* misc */
.modal{position:fixed;inset:0;z-index:20;background:rgba(20,35,28,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .card{width:100%;max-width:520px;max-height:85vh;overflow:auto;margin:0}
.ph{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #EDF1EE}
.ph:last-child{border-bottom:0}
.ph button{padding:6px 10px}.ph .grow{flex:1}
.str{display:inline-flex;gap:2px}.str i{width:7px;height:12px;border-radius:2px;background:#DCE3DE}.str i.f{background:var(--gold)}

/* motion that answers an action */
@keyframes pop{0%{transform:scale(.97)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.opt.ok,.tile.ok{animation:pop .32s ease-out}
.opt.bad,.answer.bad{animation:shake .36s ease-out}
#app.enter{animation:enter .24s ease-out}
.done-icon{animation:pop .45s ease-out}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="in"><span class="logo"><span class="mark" aria-hidden="true"></span>Bangla Speak</span><nav><button data-v="home" onclick="home()">Learn</button><button data-v="hub" onclick="hub()">Practice</button></nav></div></header>
<main id="app"></main>
<div id="sheet"></div>
<div id="modal"></div>
<div id="tip"></div>

<script src="audio/manifest.js"></script>

okhane thaken.","bn":"হ্যাঁ, সাতক্ষীরাতে। আমার বাবা-মা ওখানে থাকেন।","en":"Yes, in Satkhira. My parents live there."},{"q":"Where do Tanvir's parents live?","opts":["In Dhaka","In Satkhira, on the coast","Inside the Sundarbans"],"a":1},{"who":"b","rom":"Ghurnijhor ele onara ki koren?","bn":"ঘূর্ণিঝড় এলে ওনারা কী করেন?","en":"What do they do when a cyclone comes?"},{"who":"a","item":"s8u07_ghurnijhor"},{"who":"a","item":"s8u07_lona"},{"q":"According to Tanvir, what has made growing rice hard on the coast?","opts":["Too many trees","Salt water getting in","Polluted Dhaka air"],"a":1},{"who":"b","item":"s8u07_jolbayu"},{"who":"a","item":"s8u07_shundorbon"},{"who":"b","item":"s8u07_gorom"},{"who":"a","rom":"Ekdom! Ar Dhakay to gach kome jacche.","bn":"একদম! আর ঢাকায় তো গাছ কমে যাচ্ছে।","en":"Totally! And in Dhaka the trees keep disappearing."},{"who":"b","item":"s8u07_shocheton"},{"who":"a","rom":"Thik bolecho. Cholo, cha khai.","bn":"ঠিক বলেছো। চলো, চা খাই।","en":"You're right. Come on, let's have some tea."}],"voices":{"b":"m","a":"m2"}},"s8u08":{"title":"Tea Break Tech Talk","cast":{"a":"Farhan (office colleague)","b":"Rob"},"lines":[{"who":"a","rom":"Rob bhai, apnar fone ki hoyeche?","bn":"রব ভাই, আপনার ফোনে কী হয়েছে?","en":"Rob, what's going on with your phone?"},{"who":"b","item":"s8u08_update"},{"who":"a","rom":"Ekbar restart diye dekhun.","bn":"একবার রিস্টার্ট দিয়ে দেখুন।","en":"Try restarting it once."},{"who":"b","rom":"Accha. Apni ki AI bebohar koren?","bn":"আচ্ছা। আপনি কি এআই ব্যবহার করেন?","en":"Okay. Do you use AI?"},{"who":"a","item":"s8u08_ai"},{"who":"a","item":"s8u08_bhul"},{"q":"What does Farhan warn about AI?","opts":["It is too expensive","It doesn't always give the right answer","It only works in English"],"a":1},{"who":"b","item":"s8u08_chakri"},{"who":"a","item":"s8u08_mone"},{"who":"a","item":"s8u08_freelancing"},{"q":"What does Farhan's cousin do?","opts":["He freelances from home and earns well","He repairs phones","He teaches at a university"],"a":0},{"who":"b","item":"s8u08_ammu"},{"who":"a","rom":"Khub bhalo korechen! Kintu ekta kotha.","bn":"খুব ভালো করেছেন! কিন্তু একটা কথা।","en":"Good for you! But one thing."},{"who":"a","item":"s8u08_otp"},{"who":"b","rom":"Ji, ami take agei bole diyechi.","bn":"জি, আমি তাকে আগেই বলে দিয়েছি।","en":"Yes, I've already told her."},{"q":"What should Rob's mother never tell anyone?","opts":["Her OTP or PIN","How to video call","Her new phone number"],"a":0},{"who":"a","item":"s8u08_nirbhor"},{"who":"b","item":"s8u08_future"}],"voices":{"b":"m","a":"m2"}},"s8u09":{"title":"A Speech at the Tree-Planting Program","cast":{"a":"Mahmuda (event host)","b":"Rob"},"lines":[{"who":"a","item":"s8u09_shudhimondoli"},{"who":"a","item":"s8u09_silent"},{"who":"a","item":"s8u09_ashon"},{"who":"a","item":"s8u09_shagoto"},{"who":"a","item":"s8u09_jatiyo"},{"who":"a","rom":"Ebar amader bishesh otithi, America theke asha Rob, kichu bolben.","bn":"এবার আমাদের বিশেষ অতিথি, আমেরিকা থেকে আসা রব, কিছু বলবেন।","en":"Next, our special guest Rob, who has come from America, will say a few words."},{"q":"Who is Rob at this event?","opts":["The chair of the meeting","A special guest who will say a few words","The train announcer"],"a":1},{"who":"b","item":"s8u09_mohoday"},{"who":"b","rom":"Ami Bangla shikhchi, tai bhul hole khoma korben.","bn":"আমি বাংলা শিখছি, তাই ভুল হলে ক্ষমা করবেন।","en":"I'm learning Bangla, so please forgive any mistakes."},{"who":"b","rom":"Aj ekhane gach lagano kormoshuchite ashte pere ami anondito.","bn":"আজ এখানে গাছ লাগানো কর্মসূচিতে আসতে পেরে আমি আনন্দিত।","en":"I'm delighted to be here today at this tree-planting program."},{"q":"What kind of event is it?","opts":["A wedding","A train opening","A tree-planting program"],"a":2},{"who":"b","item":"s8u09_asha"},{"who":"b","item":"s8u09_bisheshbhabe"},{"who":"b","item":"s8u09_dhonnobad"},{"who":"b","item":"s8u09_shesh"},{"who":"a","rom":"Robke onek dhonnobad.","bn":"রবকে অনেক ধন্যবাদ।","en":"Many thanks to Rob."},{"who":"a","item":"s8u09_proshno"},{"q":"What does the host invite the audience to do at the end?","opts":["Raise their hands if they have questions","Plant trees straight away","Leave quickly"],"a":0}],"voices":{"b":"m","a":"f"}},"s8u10":{"title":"Running Into an Old Friend","cast":{"a":"Rafi (old friend)","b":"Rob"},"lines":[{"who":"a","item":"s8u10_khobor"},{"who":"b","rom":"Rafi! Ami bhalo achi. Tumi kemon acho?","bn":"রাফি! আমি ভালো আছি। তুমি কেমন আছো?","en":"Rafi! I'm good. How are you?"},{"who":"a","item":"s8u10_besto"},{"who":"b","item":"s8u10_naki"},{"who":"a","item":"s8u10_join"},{"q":"Why hasn't Rafi got the hang of everything yet?","opts":["He only joined his new job last month","He just moved to Sylhet","His father is in hospital"],"a":0},{"who":"b","item":"s8u10_shorir"},{"who":"a","item":"s8u10_abbu"},{"q":"How is Rafi's father now?","opts":["Still in the hospital","Fine after a minor operation","Traveling in Sylhet"],"a":1},{"who":"a","item":"s8u10_dam"},{"who":"a","rom":"Ar officer shobai bolche AI amader chakri kere nebe.","bn":"আর অফিসের সবাই বলছে এআই আমাদের চাকরি কেড়ে নেবে।","en":"And everyone at the office is saying AI will take our jobs."},{"who":"b","item":"s8u10_jukti"},{"who":"a","item":"s8u10_shohoj"},{"who":"b","item":"s8u10_bhabchi"},{"who":"a","item":"s8u10_borsha"},{"q":"When does Rafi say Sylhet looks its best?","opts":["In winter","During Eid","In the rainy season"],"a":2},{"who":"a","item":"s8u10_dawat"},{"who":"b","item":"s8u10_uthi"},{"who":"a","item":"s8u10_jogajog"}],"voices":{"b":"m","a":"m2"}}};
const COURSE = {"sections":[{"id":"s1","title":"Section 1 · Survival","desc":"A1 · Greetings, food, money, family, getting around","units":[{"id":"s1u01","title":"Greetings & Introductions","desc":"Say hello, ask how someone is, introduce yourself","guide":{"tips":["Grammar: achi goes with \"I\" and achen goes with polite \"you\". Ami bhalo achi = I am fine. Apni kemon achen? = How are you?","Apni / apnar is the polite \"you / your\". Use it with anyone you don't know well. The casual tumi comes in Section 2.","People often drop ami, so just \"Bhalo achi\" is natural too. In casual Dhaka talk you'll also hear shikhtesi for shikhchi (I am learning); stick with shikhchi, which is understood everywhere.","Most people greet with Assalamu alaikum; many Hindu Bangladeshis say Nomoshkar. Greet back with whatever someone used with you.","Khoda hafez is the classic goodbye. You will also hear Allah hafez."],"phrases":["s1u01_salam","s1u01_walaikum","s1u01_kemon","s1u01_bhalo","s1u01_namki","s1u01_amarnam","s1u01_dekha","s1u01_abar","s1u01_khoda"]},"lessons":[["s1u01_salam","s1u01_walaikum","s1u01_khoda","s1u01_nomoshkar"],["s1u01_kemon","s1u01_bhalo","s1u01_apni","s1u01_salam","s1u01_walaikum"],["s1u01_alhamdulillah","s1u01_cholche","s1u01_kemon","s1u01_apni","s1u01_khoda"],["s1u01_namki","s1u01_amarnam","s1u01_dekha","s1u01_bhalo","s1u01_salam"],["s1u01_shikhchi","s1u01_ektu","s1u01_abar","s1u01_namki","s1u01_dekha","s1u01_khoda"]],"story":"s1u01"},{"id":"s1u02","title":"Polite Basics","desc":"Yes and no, thank you, sorry, and asking people to repeat or slow down","guide":{"tips":["Grammar: To politely ask someone to do something, add -un to the verb: bol (say) → bolun, bosh (sit) → boshun, ash (come) → ashun. Verbs ending in a vowel just add -n: dara (stand) → daran. Two very common verbs change their vowel: de (give) → din, ne (take) → nin. This form is already polite, so you don't need a separate word for \"please\".","In everyday Bangladesh speech you will also hear -en instead of -un: bolen, boshen, ashen. Both are polite; the -un form is a little more careful.","Ji is the polite yes and Ji na the polite no. A bare Na can sound blunt to someone older than you.","Dhonnobad and Dukkhito are correct but a bit formal; for small things many people just smile, or say \"thanks\" or \"sorry\" in English. Save Onek dhonnobad for real kindness.","Bujhlam na (I didn't understand that) is what people really say when they miss something; take it as a fixed phrase for now. Follow it with Ektu aste bolun or Abar bolun and people will happily slow down for you."],"phrases":["s1u02_ji","s1u02_jina","s1u02_dhonnobad","s1u02_dukkhito","s1u02_bujhi_na","s1u02_abar","s1u02_aste","s1u02_boshun","s1u02_bhitore"]},"lessons":[["s1u02_ji","s1u02_jina","s1u02_dhonnobad","s1u02_thik"],["s1u02_onek","s1u02_jina_dhonnobad","s1u02_dukkhito","s1u02_ji","s1u02_dhonnobad"],["s1u02_maf","s1u02_bujhi_na","s1u02_abar","s1u02_dukkhito","s1u02_jina"],["s1u02_aste","s1u02_din","s1u02_nin","s1u02_bujhi_na","s1u02_abar","s1u02_onek"],["s1u02_boshun","s1u02_bhitore","s1u02_daran","s1u02_nin","s1u02_thik","s1u02_aste"]],"story":"s1u02"},{"id":"s1u03","title":"Food & Drink","desc":"Ask for water, tea and rice, say what you want and when you've had enough","guide":{"tips":["Grammar: chai means \"(I) want\": Ami pani chai = I want water. To ask for something politely, put the thing first and din (please give) last: Pani din = Water, please. Add ektu (a little) to sound softer: Ektu pani din.","Don't mix up cha (tea) and chai (want). Ami cha chai = I want tea.","In Bangla you \"eat\" drinks too. A host offering tea will ask Cha khaben? — literally \"Will you eat tea?\" — and a polite Ji is all you need to answer.","Tea stalls serve dudh cha strong and sweet, often with condensed milk. Ask for rong cha if you want it without milk, and say Chini chara if you want no sugar.","Hosts will keep refilling your plate. Ar chai na, said with a smile (maybe more than once), is a polite way to stop."],"phrases":["s1u03_chai_pani","s1u03_pani_din","s1u03_cup_cha","s1u03_rong_cha","s1u03_chini_chara","s1u03_ki_lagbe","s1u03_ar_ektu","s1u03_ar_chai_na","s1u03_cha_chai"]},"lessons":[["s1u03_pani","s1u03_cha","s1u03_chai_pani","s1u03_pani_din"],["s1u03_thanda","s1u03_cup_cha","s1u03_dudh_cha","s1u03_pani_din","s1u03_cha"],["s1u03_rong_cha","s1u03_chini_chara","s1u03_ki_lagbe","s1u03_cup_cha","s1u03_dudh_cha"],["s1u03_bhat_dal","s1u03_ar_ektu","s1u03_chamoch","s1u03_chai_pani","s1u03_ki_lagbe"],["s1u03_ar_chai_na","s1u03_eta_ki","s1u03_cha_chai","s1u03_ar_ektu","s1u03_bhat_dal","s1u03_thanda"]],"story":"s1u03"},{"id":"s1u04","title":"Numbers & Money","desc":"Count to ten, say prices in taka and ask how much something costs","guide":{"tips":["Grammar: koto means \"how much\" or \"how many\". Put it after the thing you're asking about (Dam koto? = price how-much?, Bhara koto? = fare how-much?) or before a noun (Koto taka? = how many taka?). Eta koto? = this how-much? Bangla needs no word for \"is\" here.","1–10: ek, dui, tin, char, pach, choy, shat, at, noy, dosh. Then bish (20), ponchash (50), eksho (100).","Prices are just number + taka: Dosh taka, Eksho taka. Price tags and menus often use Bangla digits (১০ = 10), so it helps to ask out loud and listen for the spoken number.","Koto holo? is what you ask at the end, when you've bought a few things and want the total.","Carry small notes. Rickshaw pullers and tea stalls often can't change a big note."],"phrases":["s1u04_ek_dui_tin","s1u04_char_panch_choy","s1u04_shat_at_noy_dosh","s1u04_koto_taka","s1u04_dam_koto","s1u04_etar_dam","s1u04_bhara","s1u04_koto_holo","s1u04_ei_nin"]},"lessons":[["s1u04_ek_dui_tin","s1u04_char_panch_choy","s1u04_shat_at_noy_dosh","s1u04_koto_taka"],["s1u04_panch_taka","s1u04_dosh_taka","s1u04_dam_koto","s1u04_koto_taka","s1u04_ek_dui_tin"],["s1u04_bish_taka","s1u04_ponchash_taka","s1u04_etar_dam","s1u04_dosh_taka","s1u04_shat_at_noy_dosh"],["s1u04_eksho_taka","s1u04_bhara","s1u04_dui_cup","s1u04_ponchash_taka","s1u04_dam_koto","s1u04_char_panch_choy"],["s1u04_koto_holo","s1u04_ei_nin","s1u04_etar_dam","s1u04_eksho_taka","s1u04_bish_taka","s1u04_bhara"]],"story":"s1u04"},{"id":"s1u05","title":"Family","desc":"Introduce your family and ask about someone else's","guide":{"tips":["Grammar: Bangla says \"my brother is there\" for \"I have a brother\": Amar ek bhai ache. To ask, use apnar: Apnar bhai bon ache? For \"don't have\", swap ache for nei: Amar kono bon nei. (You'll practise nei more in Section 2.)","Ini = this person here, uni = that person / he / she. Both are polite, and Bangla uses the same word for he and she.","Older and younger matter: boro bhai (older brother), choto bon (younger sister). Many Muslim families call parents Abba/Amma or Abbu/Ammu at home; Hindu families often say Baba/Ma.","Bhai (brother) and Apa (sister) are the polite way to call a stranger — a shopkeeper, rickshaw puller or a woman at a counter. Bhai, shunun gets attention politely. Among Hindus you'll also hear Dada (older brother) and Didi (older sister).","Asking about family is friendly, not nosy. Expect questions about your parents, siblings, children and whether you're married."],"phrases":["s1u05_ini_ma","s1u05_uni_ke","s1u05_poribar","s1u05_boro_bhai","s1u05_bhai_bon_ache","s1u05_ek_bhai","s1u05_bon_nei","s1u05_chele_meye","s1u05_bhai_shunun"]},"lessons":[["s1u05_ini_ma","s1u05_uni_baba","s1u05_uni_ke","s1u05_poribar"],["s1u05_boro_bhai","s1u05_choto_bon","s1u05_bhai_shunun","s1u05_ini_ma","s1u05_uni_ke"],["s1u05_bhai_bon_ache","s1u05_ek_bhai","s1u05_dui_bon","s1u05_boro_bhai","s1u05_uni_baba"],["s1u05_bon_nei","s1u05_chele_meye","s1u05_ek_chele","s1u05_bhai_bon_ache","s1u05_poribar"],["s1u05_baba_ma","s1u05_apa_shunun","s1u05_bhai_shunun","s1u05_ek_chele","s1u05_bon_nei","s1u05_dui_bon"]],"story":"s1u05"},{"id":"s1u06","title":"Where You're From","desc":"Say where you're from, ask where someone lives, talk about home towns","guide":{"tips":["Grammar: theke means \"from\" and comes after the place: America theke = from America. kothay (where) sits right before the verb: Apni kothay thaken? = Where do you live? thaki = I live, thaken = you live (polite).","To say \"in\" a place, Bangla adds an ending to the place name: Dhakay = in Dhaka, Dhanmondite = in Dhanmondi. You'll learn this ending properly in Section 2; for now learn these as set phrases.","Apnar bari kothay? is not asking for your street address. It asks where your family comes from, your home district. Bangladeshis love this question, and an answer like Sylhet or Barishal starts a long chat.","As a foreigner you'll hear Apni ki bideshi? and Bangladesh kemon lagche? all the time. A warm Bangladesh khub shundor always goes down well."],"phrases":["s1u06_desh","s1u06_america","s1u06_bideshi","s1u06_thaken","s1u06_dhakay","s1u06_bari","s1u06_kemonlagche","s1u06_shundor"]},"lessons":[["s1u06_desh","s1u06_america","s1u06_amardesh","s1u06_bideshi"],["s1u06_americar","s1u06_konshohor","s1u06_thaken","s1u06_desh","s1u06_america"],["s1u06_dhakay","s1u06_dhakaykothay","s1u06_dhanmondi","s1u06_thaken","s1u06_bideshi"],["s1u06_ekhane","s1u06_bari","s1u06_sylhet","s1u06_dhakay","s1u06_americar"],["s1u06_kemonlagche","s1u06_shundor","s1u06_bari","s1u06_dhanmondi","s1u06_amardesh","s1u06_konshohor"]],"story":"s1u06"},{"id":"s1u07","title":"Getting Around","desc":"Take a rickshaw, give directions, agree a fare, and get off where you want","guide":{"tips":["Grammar: the ending -bo means \"I will\": jabo = I'll go, nambo = I'll get off, debo = I'll pay. For polite you it's -ben (jaben, neben), and for he / she / it it's -be (jabe, lagbe).","With jabo you don't need a word for \"to\": Gulshan jabo = I'll go to Gulshan.","Dhaka rickshaw pullers are very often called mama, a friendly everyday way to address them: Mama, jaben? Always agree on the fare before you get on.","dan = right, bam = left (you'll also hear dane / bame). In a rickshaw you'll often hear the casual Mama, ekhane rakhen for \"stop here\".","In everyday Bangladeshi speech many people say dibo / niben instead of debo / neben. Both are understood everywhere."],"phrases":["s1u07_riksha","s1u07_kothayjaben","s1u07_gulshan","s1u07_kotoneben","s1u07_dan","s1u07_bam","s1u07_shoja","s1u07_thamun","s1u07_nambo"]},"lessons":[["s1u07_riksha","s1u07_kothayjaben","s1u07_gulshan","s1u07_kotoneben"],["s1u07_ponchash","s1u07_shoja","s1u07_thamun","s1u07_riksha","s1u07_gulshan"],["s1u07_dan","s1u07_bam","s1u07_shamne","s1u07_shoja","s1u07_thamun"],["s1u07_nambo","s1u07_aste","s1u07_taratari","s1u07_kothayjaben","s1u07_dan"],["s1u07_rasta","s1u07_kotokkhon","s1u07_nambo","s1u07_kotoneben","s1u07_bam","s1u07_shamne"]],"story":"s1u07"},{"id":"s1u08","title":"Shopping & Bargaining","desc":"Ask the price, haggle politely, and buy (or walk away)","guide":{"tips":["Grammar: beshi = more / too much, kom = less. Dam onek beshi = the price is too high. Beshi chaichen = you're asking too much. Ektu kom korun = make it a little less. Ar kom hobe na = it won't go any lower.","Bargaining is normal at markets, street stalls and with rickshaws, but not in supermarkets or shops that say \"fixed price\".","Stay friendly. A smile and Onno dokane dekhi (let me look in another shop) is often the moment the price drops.","Last dam koto? mixes the English word last into Bangla. It's completely normal and everyone says it.","Shopkeepers are often short of small notes, so Bhangti ache? (Do you have change?) is a question you'll both ask and hear."],"phrases":["s1u08_kotokore","s1u08_dambeshi","s1u08_komkorun","s1u08_etodam","s1u08_lastdam","s1u08_eksho","s1u08_onnodokan","s1u08_nebo"]},"lessons":[["s1u08_dekhan","s1u08_kotokore","s1u08_dambeshi","s1u08_komkorun"],["s1u08_etodam","s1u08_lastdam","s1u08_eksho","s1u08_kotokore","s1u08_dambeshi"],["s1u08_komhobena","s1u08_beshichaichen","s1u08_onnodokan","s1u08_komkorun","s1u08_eksho"],["s1u08_nebo","s1u08_nebona","s1u08_thikdin","s1u08_lastdam","s1u08_etodam"],["s1u08_bhangti","s1u08_jinish","s1u08_dekhan","s1u08_onnodokan","s1u08_beshichaichen","s1u08_komhobena"]],"story":"s1u08"},{"id":"s1u09","title":"Time & Days","desc":"Talk about now, today, tomorrow, yesterday and the days of the week","guide":{"tips":["Grammar: kal means both \"tomorrow\" and \"yesterday\", and the verb tells you which. Kal ashbo (will come) = I'll come tomorrow. Kal chuti chilo (was) = yesterday was a holiday. porshu works the same way: the day after tomorrow or the day before yesterday.","The days: shombar (Mon), mongolbar (Tue), budhbar (Wed), brihoshpotibar (Thu), shukrobar (Fri), shonibar (Sat), robibar (Sun). They all end in -bar, \"day\". In everyday talk Thursday is often bishudbar.","No word for \"on\" is needed with days: Budhbar ashbo = I'll come on Wednesday. To ask which day, use kobe: Kobe ashben? (kokhon asks more generally \"when\").","In Bangladesh the weekend is Friday and Saturday. Sunday (robibar) is a normal working day, and Friday midday is time for Jumma prayers.","Ekhoni ashchi (I'm coming right now) is what everyone says, even when they need ten more minutes!"],"phrases":["s1u09_ajkibar","s1u09_ekhoni","s1u09_kobe","s1u09_kalashbo","s1u09_kaldekha","s1u09_porshu","s1u09_kalchuti","s1u09_shonibarchuti","s1u09_agami"]},"lessons":[["s1u09_ajkibar","s1u09_ajshukrobar","s1u09_ekhonna","s1u09_ekhoni"],["s1u09_kobe","s1u09_kalashbo","s1u09_budhbar","s1u09_ajkibar","s1u09_ekhoni"],["s1u09_kaldekha","s1u09_porshu","s1u09_ajnakal","s1u09_kobe","s1u09_kalashbo"],["s1u09_kalchuti","s1u09_shukrobarbondho","s1u09_shonibarchuti","s1u09_robibarkhola","s1u09_ajshukrobar","s1u09_porshu"],["s1u09_agami","s1u09_pore","s1u09_kaldekha","s1u09_ekhonna","s1u09_budhbar","s1u09_ajnakal"]],"story":"s1u09"},{"id":"s1u10","title":"Likes & Daily Life","desc":"Say what you like and don't like, and talk about simple daily habits","guide":{"tips":["Grammar: two ways to say \"I like\". Amar ... bhalo lage (literally \"to me ... feels good\") starts with amar, not ami: Amar cha bhalo lage. Ami ... pochondo kori (\"I do liking\") starts with ami: Ami mach pochondo kori. Put na at the very end for \"don't\": Amar jhal bhalo lage na.","bhalobashi (love) is stronger than like. Ami deshi khabar bhalobashi = I love Bangladeshi food. It's fine for food, places and hobbies.","Bangla \"eats\" drinks too: Ami protidin cha khai = I drink tea every day. khai covers both eating and drinking.","deshi means \"of our country\". deshi khabar is home-style Bangladeshi food, and calling something deshi is usually a compliment.","Cricket is the national passion. Ami cricket dekhi will start a conversation almost anywhere."],"phrases":["s1u10_chabhalo","s1u10_jhal","s1u10_apnarki","s1u10_mach","s1u10_chapochondo","s1u10_deshi","s1u10_protidin","s1u10_shokh"]},"lessons":[["s1u10_chabhalo","s1u10_khub","s1u10_beshina","s1u10_jhal"],["s1u10_apnarki","s1u10_dhaka","s1u10_mach","s1u10_chabhalo","s1u10_jhal"],["s1u10_chapochondo","s1u10_biriyani","s1u10_deshi","s1u10_mach","s1u10_khub"],["s1u10_protidin","s1u10_gan","s1u10_cricket","s1u10_apnarki","s1u10_deshi"],["s1u10_shokh","s1u10_boi","s1u10_gan","s1u10_chapochondo","s1u10_beshina","s1u10_dhaka"]],"story":"s1u10"}]},{"id":"s2","title":"Section 2 · Everyday","desc":"A1 · Friends, routines, home, weather, time, phone calls","units":[{"id":"s2u01","title":"Friends & Tumi","desc":"Talk casually with friends using tumi, and know when to use apni","guide":{"tips":["Grammar: With tumi, verbs end in -o: tumi acho, tumi koro, tumi thako. With apni they end in -en: apni achen, apni koren, apni thaken. Tomar = your (casual), apnar = your (polite).","Use apni with elders, strangers, shopkeepers and anyone senior. Use tumi with friends, people your own age once you're friendly, and children. When unsure, start with apni and let the other person offer tumi.","Amake tumi kore bolo means \"just use tumi with me\". When someone says it, they're being friendly, so switch to tumi.","There is also a very intimate \"you\", tui, used between close friends and with family. From a learner it can sound rude, so just recognize it.","Tomar bari kothay? usually asks which district your family comes from, not your street address. Ki khobor? and Ki obostha? are relaxed \"what's up?\" greetings."],"phrases":["s2u01_kemon_acho","s2u01_tumi","s2u01_ki_khobor","s2u01_nam","s2u01_dekha","s2u01_thako","s2u01_bari","s2u01_tumi_bolo","s2u01_theko"]},"lessons":[["s2u01_kemon_acho","s2u01_tumi","s2u01_ki_khobor","s2u01_theko"],["s2u01_nam","s2u01_dekha","s2u01_ki_obostha","s2u01_kemon_acho","s2u01_tumi"],["s2u01_bondhu","s2u01_thako","s2u01_bari","s2u01_nam","s2u01_theko"],["s2u01_ki_koro","s2u01_pore","s2u01_ki_khobor","s2u01_thako","s2u01_dekha"],["s2u01_tumi_boli","s2u01_tumi_bolo","s2u01_ki_obostha","s2u01_bari","s2u01_pore","s2u01_bondhu"]],"story":"s2u01"},{"id":"s2u02","title":"Daily Routine","desc":"Talk about waking, bathing, working and sleeping","guide":{"tips":["Grammar: The verb ending changes with the person: ami kori, tumi koro, apni koren, o/she kore. The same pattern: uthi / otho / othen / othe, and khai / khao / khan / khay. For someone you respect, like Abba, use the -en form even when talking about them: Abba namaj poren.","To say \"don't\", put na after the verb: Ami beshi ghumai na = I don't sleep much.","Bangla uses khai (eat) for drinks too: cha khai = I drink tea, pani khai = I drink water.","O and she both mean he or she; Bangla doesn't mark gender. In speech, o is the more common one for someone you know.","Gosol is the everyday Bangladeshi word for bathing. In the heat, many people bathe twice a day."],"phrases":["s2u02_uthi","s2u02_otho","s2u02_ghuman","s2u02_gosol","s2u02_cha","s2u02_kaj","s2u02_o_othe","s2u02_namaz","s2u02_na"]},"lessons":[["s2u02_uthi","s2u02_otho","s2u02_ghuman","s2u02_deri"],["s2u02_gosol","s2u02_cha","s2u02_na","s2u02_uthi","s2u02_otho"],["s2u02_office","s2u02_kaj","s2u02_kaj_kothay","s2u02_ghuman","s2u02_cha"],["s2u02_o_othe","s2u02_namaz","s2u02_deri","s2u02_kaj","s2u02_gosol"],["s2u02_fere","s2u02_bhat","s2u02_o_othe","s2u02_namaz","s2u02_kaj_kothay","s2u02_na"]],"story":"s2u02"},{"id":"s2u03","title":"Counting Things","desc":"Numbers 11 to 100 and counting things and people","guide":{"tips":["Grammar: When you count things, add -ta to the number: ekta, duita, tinta, charta, bishta. For people, add -jon: ekjon, duijon, charjon. Ask Koyta? for things and Koyjon? for people.","-ti (ekti) means the same as -ta but sounds a little more careful or formal. -ta is the everyday choice.","Each number from 11 to 100 has its own word, so learn them a few at a time. Start with ones you'll hear in prices: egaro (11), baro (12), ponero (15), bish (20), pochish (25), trish (30), chollish (40), ponchash (50), eksho (100).","Bananas and eggs are often sold by the hali (a set of four) or the dojon (dozen).","Mama (literally \"uncle\") is a friendly way to call a tea seller or rickshaw driver. With mama most people use the casual dao."],"phrases":["s2u03_koyta","s2u03_koyjon","s2u03_ekta_cha","s2u03_ar_ekta","s2u03_charjon","s2u03_proshno","s2u03_boyosh","s2u03_hali","s2u03_shob"]},"lessons":[["s2u03_koyta","s2u03_ekta_cha","s2u03_ar_ekta","s2u03_duita_cha"],["s2u03_koyjon","s2u03_charjon","s2u03_ekjon_bondhu","s2u03_koyta","s2u03_ekta_cha"],["s2u03_proshno","s2u03_boyosh","s2u03_egaro","s2u03_charjon","s2u03_duita_cha"],["s2u03_bishta_dim","s2u03_ponero","s2u03_hali","s2u03_ar_ekta","s2u03_koyjon"],["s2u03_pochish","s2u03_chollish","s2u03_shob","s2u03_hali","s2u03_boyosh","s2u03_proshno"]],"story":"s2u03"},{"id":"s2u04","title":"At Home","desc":"Rooms, furniture, and saying what's there and what isn't","guide":{"tips":["Grammar: ache = there is / is (somewhere), nei = there isn't / isn't (there). To say \"in\", \"at\" or \"on\", add -e, -te or -y to the place: ghor → ghore (in the room), bari → barite (at home), tebil → tebile (on the table), sofa → sofay (on the sofa).","Nei works for people too: Abba barite nei = Dad isn't home.","Basha is where you live now, often a rented flat. Bari is a house, or your family home back in your home district.","Current nei = the power's out. Power cuts (load-shedding) happen, and in many buildings no power means no water pump, so the taps run dry too.","Guests are welcomed with Bhitore ashun (polite) or Bhitore esho (casual), both meaning \"come in\", and Boshun (please sit). Take your shoes off at the door."],"phrases":["s2u04_keu","s2u04_bhitore","s2u04_sofay","s2u04_barite","s2u04_ranna","s2u04_abba_nei","s2u04_koyta_ghor","s2u04_current","s2u04_bathroom"]},"lessons":[["s2u04_keu","s2u04_bhitore","s2u04_sofay","s2u04_barite"],["s2u04_boshar","s2u04_shobar","s2u04_ranna","s2u04_bhitore","s2u04_keu"],["s2u04_khat","s2u04_janala","s2u04_current","s2u04_sofay","s2u04_boshar"],["s2u04_abba_nei","s2u04_chabi","s2u04_kapor","s2u04_barite","s2u04_janala"],["s2u04_koyta_ghor","s2u04_bathroom","s2u04_current","s2u04_ranna","s2u04_abba_nei","s2u04_shobar"]],"story":"s2u04"},{"id":"s2u05","title":"Meals at Home","desc":"Breakfast, lunch and dinner, cooking, and saying what you want to do","guide":{"tips":["Grammar: To say you want to do something, put the verb's -te form before chai: khete chai (want to eat), shikhte chai (want to learn). Change chai to match the person: tumi chao, apni chan. Put na at the end for \"don't want to\": khete chai na.","Meals: nasta is breakfast (or a snack), dupurer khabar is lunch, rater khabar is dinner. Lunch and dinner usually mean bhat with dal, a vegetable dish, and fish or meat.","Most Bangladeshis eat rice with the right hand. Giving it a try is warmly appreciated.","Khete ashun (polite) / Khete esho (casual) is how people call each other to the table, often more than once."],"phrases":["s2u05_khete_chai","s2u05_ki_khete_chan","s2u05_toiri","s2u05_khete_ashun","s2u05_khete_esho","s2u05_bhat_dal","s2u05_hat","s2u05_moja","s2u05_ar_na"]},"lessons":[["s2u05_khete_chai","s2u05_ki_khete_chao","s2u05_ki_khete_chan","s2u05_nasta"],["s2u05_toiri","s2u05_khete_ashun","s2u05_khete_esho","s2u05_khete_chai"],["s2u05_bhat_dal","s2u05_moja","s2u05_lobon","s2u05_ki_khete_chan","s2u05_toiri"],["s2u05_hat","s2u05_ar_na","s2u05_dupur","s2u05_moja","s2u05_khete_ashun"],["s2u05_rate","s2u05_ammu","s2u05_ranna_shikhte","s2u05_nasta","s2u05_ar_na","s2u05_ki_khete_chao"]],"story":"s2u05"},{"id":"s2u06","title":"Clothes & Colors","desc":"Name colors, talk about clothes and shoes, give a compliment","guide":{"tips":["Grammar: Adjectives go before the noun, just like English, and they never change form: lal shari (red sari), notun jama (new shirt), kalo juta (black shoes). Add -ta to a noun for \"the\": jamata = the shirt, jutata = the shoes.","Colors: lal (red), nil (blue), shobuj (green), holud (yellow), kalo (black), shada (white), golapi (pink). Ask about any of them with Eta ki rong?","Apnake shundor lagche literally means \"to you, nice it seems\". It is a warm, everyday compliment about someone's clothes or look. With a friend: Tomake shundor lagche.","A panjabi is the long tunic men wear for Eid, Friday prayers and weddings. Women often wear a shari (sari) or a salwar kameez.","White (shada) is linked with mourning, so brides and wedding guests usually choose bright colors. A white panjabi for Eid or Friday prayers is perfectly normal, though."],"phrases":["s2u06_ki_rong","s2u06_priyo_nil","s2u06_tomar_priyo","s2u06_notun_jama","s2u06_jama_shundor","s2u06_shundor_lagche","s2u06_kon_jama","s2u06_juta","s2u06_boro"]},"lessons":[["s2u06_ki_rong","s2u06_lal_na_nil","s2u06_priyo_nil","s2u06_tomar_priyo"],["s2u06_kalo_bhalo","s2u06_holud_panjabi","s2u06_shobuj_dekhun","s2u06_ki_rong","s2u06_priyo_nil"],["s2u06_notun_jama","s2u06_jama_shundor","s2u06_shundor_lagche","s2u06_shobuj_dekhun","s2u06_tomar_priyo"],["s2u06_kon_jama","s2u06_kalo_porbo","s2u06_juta","s2u06_lal_na_nil","s2u06_notun_jama"],["s2u06_choto","s2u06_boro","s2u06_juta","s2u06_jama_shundor","s2u06_holud_panjabi","s2u06_kalo_bhalo"]],"story":"s2u06"},{"id":"s2u07","title":"Weather & Seasons","desc":"Talk about heat, rain and cold, and Bangladesh's six seasons","guide":{"tips":["Grammar: Bangla needs no \"it\" for weather. Brishti hocche = rain is happening; Brishti porche = rain is falling; both mean \"it's raining\". Porche also means \"is setting in\": Gorom porche (the heat is on), Thanda porche (it's getting cold). For future, swap in hobe: Brishti hobe = it will rain.","Thanda lagche is about how you feel (\"I feel cold\"). Gorom lagche works the same way: \"I feel hot\".","The six seasons: grishsho (summer), borsha (monsoon), shorot (early autumn), hemonto (late autumn), sheet (winter), boshonto (spring). Add -kal for \"season\": borshakal, sheetkal. In daily talk people mostly mention gorom, borsha and sheet.","In Dhaka casual speech you will hear porse / hoitese for porche / hocche. Learn the standard forms, but don't be surprised by the short ones."],"phrases":["s2u07_abohawa","s2u07_gorom","s2u07_brishti_hocche","s2u07_baire_porche","s2u07_hobe","s2u07_thanda_lagche","s2u07_chata","s2u07_choy_ritu","s2u07_kon_ritu"]},"lessons":[["s2u07_abohawa","s2u07_gorom","s2u07_rod","s2u07_meghla"],["s2u07_brishti_hocche","s2u07_baire_porche","s2u07_hobe","s2u07_abohawa","s2u07_meghla"],["s2u07_thanda_lagche","s2u07_gorom_porche","s2u07_thanda_porche","s2u07_gorom","s2u07_brishti_hocche"],["s2u07_chata","s2u07_choy_ritu","s2u07_borshakal","s2u07_hobe","s2u07_baire_porche"],["s2u07_shitkal","s2u07_kon_ritu","s2u07_choy_ritu","s2u07_thanda_porche","s2u07_chata","s2u07_rod"]],"story":"s2u07"},{"id":"s2u08","title":"Telling Time","desc":"Ask and tell the time, say when things happen, and handle running late","guide":{"tips":["Grammar: To say \"at\" a time, add -y / -ay to the hour: shatta (seven o'clock) becomes shattay (at seven), charta becomes chartay, egarota becomes egarotay. Ask \"at what time?\" with koytay. To say what time it is, use baje: Tinta baje = it's three o'clock.","Put the part of the day first: shokal (morning), dupur (midday), bikel (afternoon), shondha (evening), rat (night). Shokal noytay = 9 a.m., rat noytay = 9 p.m.","Share = half past (share choyta = 6:30), showa = quarter past, poune = quarter to (poune noyta = 8:45). Two special words: derta = 1:30 and araita = 2:30 (never \"share ekta\" or \"share duita\").","Ar pach minit (five more minutes) is a famously flexible promise. A friend who says it may still be on the way twenty minutes later."],"phrases":["s2u08_koyta_baje","s2u08_tinta","s2u08_share","s2u08_shattay","s2u08_bikel","s2u08_koytay_ashben","s2u08_deri","s2u08_shomoy","s2u08_pach_minit"]},"lessons":[["s2u08_koyta_baje","s2u08_tinta","s2u08_share","s2u08_pach_minit"],["s2u08_derta","s2u08_poune","s2u08_shattay","s2u08_koyta_baje","s2u08_share"],["s2u08_kaj_shokal","s2u08_bikel","s2u08_rat","s2u08_shattay","s2u08_tinta"],["s2u08_shondha","s2u08_koytay_ashben","s2u08_class","s2u08_bikel","s2u08_poune"],["s2u08_deri","s2u08_shomoy","s2u08_pach_minit","s2u08_class","s2u08_kaj_shokal","s2u08_derta"]],"story":"s2u08"},{"id":"s2u09","title":"Can & Can't","desc":"Say what you can and can't do, ask about skills, and say you'll try","guide":{"tips":["Grammar: For \"can\", put the action in its -te form and add a form of par-: bolte pari (I can speak), korte paro (you can do, casual), korte paren (you can do, polite / he or she can, polite), korte pare (he or she can). Add na at the end for \"can't\": pari na. Parbo = I'll be able to; parbo na = I won't be able to, the usual way to say you can't make a plan.","You will often hear Bujhte parchi na (I can't understand). It is the same pattern: bujhte (to understand) + parchi na (am not able right now).","Swimming is shatar kata (literally \"cutting swimming\"), and singing is gan gaowa. Learn them as whole chunks: shatar katte pari, gan gaite pari.","For languages people also say jani (I know): Ami ektu Bangla jani. Cheshta korbo (I'll try) is a friendly, humble answer when someone asks if you can do something."],"phrases":["s2u09_bangla_bolte","s2u09_ingreji","s2u09_keu","s2u09_ektu_pari","s2u09_ranna","s2u09_shatar","s2u09_kal_ashte","s2u09_porte","s2u09_cheshta"]},"lessons":[["s2u09_bangla_bolte","s2u09_ektu_pari","s2u09_ingreji","s2u09_ekhono"],["s2u09_keu","s2u09_porte","s2u09_parbo","s2u09_bangla_bolte","s2u09_ingreji"],["s2u09_ranna","s2u09_uni_ranna","s2u09_gan","s2u09_ektu_pari","s2u09_ekhono"],["s2u09_shatar","s2u09_gari","s2u09_cheshta","s2u09_ranna","s2u09_parbo"],["s2u09_parbo_na","s2u09_kal_ashte","s2u09_cheshta","s2u09_keu","s2u09_shatar","s2u09_gan"]],"story":"s2u09"},{"id":"s2u10","title":"Phone Calls","desc":"Answer the phone, say who's calling, ask for someone, and call back later","guide":{"tips":["Grammar: bolchi means \"I am speaking\": the verb bol- (speak) + -chi (am ...-ing). Ami Rob bolchi = \"Rob speaking\". Polite you: bolchen (Ke bolchen? = who's speaking?); casual you: bolcho. To phone someone is fon kora: fon korbo (I'll call), fon korun (please call).","Bangladeshis answer with Hello, then usually Assalamu alaikum. Ji, bolun (Yes, go ahead) invites the caller to say why they're calling.","You will hear fon dewa (\"give a phone\") as much as fon kora: Amake fon dio = give me a call. Dio is the friendly \"do it later\" form; to an elder say Amake fon diben.","Ektu dhorun (hold on a moment) is what you'll hear before someone goes to fetch the person you asked for."],"phrases":["s2u10_hello_ke","s2u10_ami_bolchi","s2u10_ji_bolun","s2u10_dhorun","s2u10_bashay_nei","s2u10_pore_korbo","s2u10_fon_dio","s2u10_shunte","s2u10_kotha_parbo_na"]},"lessons":[["s2u10_hello_ke","s2u10_ami_bolchi","s2u10_ji_bolun","s2u10_dhorun"],["s2u10_khalu","s2u10_bashay_nei","s2u10_pore_korbo","s2u10_hello_ke","s2u10_ami_bolchi"],["s2u10_pore_korun","s2u10_fon_dio","s2u10_nombor_ki","s2u10_dhorun","s2u10_pore_korbo"],["s2u10_shunte","s2u10_jore","s2u10_bhul_nombor","s2u10_ji_bolun","s2u10_khalu"],["s2u10_besto","s2u10_kotha_parbo_na","s2u10_shunte","s2u10_fon_dio","s2u10_bashay_nei","s2u10_nombor_ki"]],"story":"s2u10"}]},{"id":"s3","title":"Section 3 · Conversations","desc":"A1 · Plans, guests, the past, health, the bazar, work","units":[{"id":"s3u01","title":"Making Plans","desc":"Suggest doing something, agree on when and where to meet","guide":{"tips":["Grammar: The -bo future changes with the person. Ami / amra: jabo, korbo. Tumi: jabe, korbe. Apni: jaben, korben. He / she: jabe (polite: jaben). Turn it into a yes/no question with ki: Tumi ki ashbe? = Will you come?","\"Let's\" = cholo (casual) or cholun (polite) + a verb ending in -i: Cholo jai = Let's go. Cholo, cha khai = Let's have tea. You will also hear the polite cholen.","With the future tense, kal means tomorrow: Kal ki korbe? = What will you do tomorrow?","Dekha kora means to meet up: Kothay dekha korbo? = Where shall we meet? Dekha hobe = we'll see each other.","Among friends in Dhaka you'll hear korba, jaiba (Kal ki korba?). It's very casual; korbe and jabe are the safe standard forms."],"phrases":["s3u01_cholo_jai","s3u01_cholun_jai","s3u01_cholo_cha","s3u01_kal_ki","s3u01_koytay","s3u01_kothay_dekha","s3u01_kal_dekha","s3u01_ashbe","s3u01_parbo_na"]},"lessons":[["s3u01_cholo_jai","s3u01_cholun_jai","s3u01_cholo_cha","s3u01_amra_kothay"],["s3u01_kal_ki","s3u01_bikele","s3u01_koytay","s3u01_cholo_jai","s3u01_amra_kothay"],["s3u01_kothay_dekha","s3u01_kal_dekha","s3u01_opekkha","s3u01_koytay","s3u01_kal_ki"],["s3u01_ashbe","s3u01_jaben","s3u01_ashbo","s3u01_parbo_na","s3u01_cholun_jai"],["s3u01_fon","s3u01_bashay","s3u01_ashbe","s3u01_parbo_na","s3u01_opekkha"]],"story":"s3u01"},{"id":"s3u02","title":"Guests & Dawat","desc":"Invite people, welcome a guest, offer food, and take your leave","guide":{"tips":["Grammar: Hosts use two polite forms. Commands end in -un or -n: ashun (come), boshun (sit), korun (do), nin (take), din (give). The polite future in -ben works as a gentle request: Abar ashben = Please come again (lit. you will come again). Add na for \"don't\": Lojja korben na = Don't be shy.","A dawat is an invitation to a meal at someone's home, and it's a big part of Bangladeshi social life. Apnar dawat roilo = consider yourself invited.","Hosts keep serving and will insist more than once. Ar lagbe na, dhonnobad is the polite way to stop; a hand over your plate helps too.","Even if the host says Kichu anben na, guests usually bring a box of mishti (sweets) or fruit.","To leave, say Aj tahole uthi (lit. \"well then, today I get up\"). The host will often protest with Ekhoni jaben? before saying Abar ashben. You'll also hear Aj ashi (lit. \"I'll come again\") as a goodbye."],"phrases":["s3u02_bhetore","s3u02_boshun","s3u02_nasta","s3u02_aro_nin","s3u02_lojja","s3u02_ar_lagbe_na","s3u02_dawat_roilo","s3u02_uthi","s3u02_abar_ashben"]},"lessons":[["s3u02_bhetore","s3u02_boshun","s3u02_basha_shundor","s3u02_nasta"],["s3u02_ki_khaben","s3u02_aro_nin","s3u02_lojja","s3u02_boshun","s3u02_nasta"],["s3u02_bhalo_ranna","s3u02_ar_lagbe_na","s3u02_aro_nin","s3u02_lojja"],["s3u02_kal_ashben","s3u02_dawat_roilo","s3u02_kichu_anben_na","s3u02_bhetore"],["s3u02_uthi","s3u02_ekhoni","s3u02_abar_ashben","s3u02_bhalo_ranna","s3u02_kal_ashben"]],"story":"s3u02"},{"id":"s3u03","title":"Yesterday","desc":"Say what you did yesterday and ask others about their day","guide":{"tips":["Grammar: For the simple past, add -lam for I / we (korlam, dekhlam), -le for tumi (korle), -len for apni (korlen) and -lo for he / she / it (holo). A few verbs change shape: jawa (go) becomes gelam, khawa (eat) becomes khelam, and achi (am) becomes chilam (was).","To say you didn't do something in the past, use -ini: jaini = I didn't go, korini = I didn't do. \"Kal kothao jaini\" = I didn't go anywhere yesterday.","With the past tense, kal means yesterday. With the future (jabo, korbo) it means tomorrow.","Bhat khelam literally means \"I ate rice\", but since rice is the heart of every meal, it often just means \"I had lunch / dinner\".","In Dhaka you'll hear casual forms like korsi (for korlam / korechi) and hoilo (for holo). Understand them, but stick to the standard forms."],"phrases":["s3u03_kal_ki_korle","s3u03_apni_korlen","s3u03_bajare","s3u03_bhat","s3u03_shinema","s3u03_kothay_gele","s3u03_bashay_chilam","s3u03_jaini","s3u03_moja_holo"]},"lessons":[["s3u03_kal_ki_korle","s3u03_bajare","s3u03_bhat","s3u03_shinema"],["s3u03_apni_korlen","s3u03_kothay_gele","s3u03_ki_khele","s3u03_bajare","s3u03_bhat"],["s3u03_bashay_chilam","s3u03_ghumalam","s3u03_kaj","s3u03_kal_ki_korle","s3u03_kothay_gele"],["s3u03_bondhu","s3u03_ammu","s3u03_brishti","s3u03_shinema","s3u03_apni_korlen"],["s3u03_jaini","s3u03_moja_holo","s3u03_bashay_chilam","s3u03_bondhu","s3u03_ki_khele"]],"story":"s3u03"},{"id":"s3u04","title":"The Weekend","desc":"Tell what you did on your day off, step by step","guide":{"tips":["Grammar: Tell a story in order with sequence words before the past-tense verb: Prothome (first) bajare gelam. Tarpor (then) bashay firlam. Erpor (after that) ranna korlam. The verbs follow last unit's pattern: firlam, hatlam, ghumalam for \"I\"; ashlo for he / she / they.","In Bangladesh the weekend is Friday (and for many, Saturday too). Many men go to the mosque for the Friday midday prayer (Jumma), and the rest of the day is family time.","Ghurte jawa means going out for fun or sightseeing — a very common weekend answer: Amra ghurte gelam.","Chuti kemon katlo? literally asks \"How did the holiday pass?\" Answer Bhalo katlo (it went well). You'll also hear the English word \"weekend\": Weekend kemon katlo?","Nani is your mother's mother and Dadi your father's mother. Visiting the nani's or dadi's house is a classic day off."],"phrases":["s3u04_chuti_katlo","s3u04_bhalo_katlo","s3u04_chutir_din","s3u04_prothome","s3u04_tarpor_firlam","s3u04_er_por","s3u04_tarpor_ki","s3u04_ghurte","s3u04_kichu_korini"]},"lessons":[["s3u04_chuti_katlo","s3u04_bhalo_katlo","s3u04_chutir_din","s3u04_prothome"],["s3u04_tarpor_firlam","s3u04_er_por","s3u04_tarpor_ki","s3u04_prothome","s3u04_chutir_din"],["s3u04_moshjid","s3u04_ghurte","s3u04_park","s3u04_tarpor_firlam","s3u04_chuti_katlo"],["s3u04_tv","s3u04_nani","s3u04_dupure","s3u04_er_por","s3u04_ghurte"],["s3u04_bondhura","s3u04_kichu_korini","s3u04_tarpor_ki","s3u04_park","s3u04_bhalo_katlo"]],"story":"s3u04"},{"id":"s3u05","title":"Feeling Unwell","desc":"Say what hurts, describe a fever or cough, and wish someone well","guide":{"tips":["Grammar: Bangla doesn't need \"have\" for aches and illness — just say \"my + body part + pain\": Amar gola byatha = I have a sore throat (lit. my throat pain). Same with illness: Amar jor = I have a fever. Add korche (\"is doing\") for pain happening right now: Amar matha byatha korche.","Some body parts take -e (\"in\"): Amar pete byatha = I have a stomachache (lit. pain in my stomach).","Amar shorir bhalo na (lit. \"my body isn't good\") is the everyday way to say you're unwell — great for calling in sick.","In Bangla you \"eat\" medicine: Oshudh khan = Take your medicine.","Ki holo? (What happened?) is how people ask what's wrong. In Dhaka you'll hear the casual Ki hoise? and Matha byatha kortese."],"phrases":["s3u05_matha","s3u05_pete","s3u05_gola","s3u05_jor","s3u05_shorir","s3u05_ki_holo","s3u05_kothay","s3u05_daktar","s3u05_oshudh","s3u05_jotno"]},"lessons":[["s3u05_matha","s3u05_pete","s3u05_gola","s3u05_kothay"],["s3u05_ekhane","s3u05_jor","s3u05_kal_theke_jor","s3u05_matha","s3u05_kothay"],["s3u05_shorir","s3u05_ki_holo","s3u05_kashi","s3u05_jor","s3u05_pete"],["s3u05_ghurche","s3u05_shorir_kemon","s3u05_daktar","s3u05_shorir","s3u05_ki_holo"],["s3u05_oshudh","s3u05_bishram","s3u05_jotno","s3u05_daktar","s3u05_ghurche"]],"story":"s3u05"},{"id":"s3u06","title":"At the Bazar","desc":"Buy vegetables and fish by the kilo, check freshness, get the total","guide":{"tips":["Grammar: Add -er to mean \"of\" when you talk about amounts: alu → alur keji (a kilo of potatoes), dim → dimer hali (a hali of eggs). Add -ta to point at one thing: mach → machta (the fish).","Bangladesh says keji for a kilo, and prices are given per keji. Alur keji koto? or Tomato koto kore? (at what rate?) are the standard ways to ask.","Eggs (and bananas) are sold by the hali, a set of four. Dimer hali koto? = how much for four eggs?","Call a vendor bhai (brother). In Dhaka you will also hear people call vendors mama (uncle). Vendors often add a few green chilies for free.","Ilish is the national fish. River fish (nodir mach) costs more than farmed fish (chasher mach), so people ask which one it is."],"phrases":["s3u06_shobji","s3u06_alu","s3u06_ek_keji","s3u06_adha","s3u06_taja","s3u06_hali","s3u06_koto_kore","s3u06_ojon","s3u06_mot"]},"lessons":[["s3u06_shobji","s3u06_alu","s3u06_ek_keji","s3u06_adha"],["s3u06_ilish","s3u06_rui","s3u06_taja","s3u06_ekdom","s3u06_alu"],["s3u06_pocha","s3u06_nodir","s3u06_morich","s3u06_taja","s3u06_ek_keji"],["s3u06_begun","s3u06_hali","s3u06_koto_kore","s3u06_shobji","s3u06_adha"],["s3u06_ojon","s3u06_mot","s3u06_koto_kore","s3u06_rui","s3u06_morich","s3u06_pocha"]],"story":"s3u06"},{"id":"s3u07","title":"Work & Jobs","desc":"Ask what people do, name jobs, talk about where and how you work","guide":{"tips":["Grammar: kora (to do) changes with the person: ami kori, tumi koro, apni koren. Uni (he/she, polite) takes the same -en ending as apni: Uni ki koren? To ask about someone's job, just ask Ki koren?","Put ekjon (one person) before a job: Ami ekjon shikkhok = I'm a teacher. Dropping it is fine too: Ami shikkhok.","Many work words are English said the Bangla way: daktar, engineer, office. Kaj is work in general, chakri is a salaried job, and bebsha is business.","The weekend in Bangladesh is Friday, and many offices also close on Saturday. Friday prayers make Friday the big family day.","Basha is the place you live in the city. Bari is the family home, often in the village."],"phrases":["s3u07_apni_koren","s3u07_tomar_chakri","s3u07_kothay_kaj","s3u07_shikkhok","s3u07_engineer","s3u07_basha","s3u07_kaj_kemon","s3u07_chakri"]},"lessons":[["s3u07_apni_koren","s3u07_tomar_chakri","s3u07_shikkhok","s3u07_engineer"],["s3u07_kothay_kaj","s3u07_basha","s3u07_bebsha","s3u07_apni_koren"],["s3u07_uni_koren","s3u07_daktar","s3u07_krishok","s3u07_shikkhok","s3u07_kothay_kaj"],["s3u07_kaj_kemon","s3u07_chap","s3u07_chuti","s3u07_tomar_chakri","s3u07_krishok"],["s3u07_chakri","s3u07_bhalobashi","s3u07_kaj_kemon","s3u07_bebsha","s3u07_engineer"]],"story":"s3u07"},{"id":"s3u08","title":"School & Study","desc":"Talk about studying, classes, subjects and exams","guide":{"tips":["Grammar: pori = I study (regularly), porchi = I'm studying (right now). The same pair works for every person: tumi poro / porcho, apni poren / porchen. Ami protidin Bangla pori, kintu ekhon boi porchi.","Pora means both \"to study\" and \"to read\". Ami ekta boi porchi = I'm reading a book.","Bangladeshis say the grade with the English word: class five e pori = I'm in grade five. Kon classe poro? is a friendly question for any child.","Ekhon porte bosho! (sit down and study now) and Mon diye poro (study with full attention) are what every Bangladeshi parent says.","Kobe asks \"which day\", while kokhon asks \"what time\". Result kobe? = when (on what day) are the results out?"],"phrases":["s3u08_kon_class","s3u08_ki_niye","s3u08_bangla_porchi","s3u08_protidin","s3u08_porikkha_kal","s3u08_kemon_holo","s3u08_motamuti","s3u08_onko"]},"lessons":[["s3u08_bangla_porchi","s3u08_protidin","s3u08_boi","s3u08_ki_niye"],["s3u08_kon_class","s3u08_aj_class","s3u08_shikkhok_poran","s3u08_protidin"],["s3u08_porikkha_kal","s3u08_shuru","s3u08_kemon_holo","s3u08_bangla_porchi"],["s3u08_motamuti","s3u08_onko","s3u08_result","s3u08_kemon_holo","s3u08_porikkha_kal"],["s3u08_porte_bosho","s3u08_mon_diye","s3u08_ki_niye","s3u08_onko","s3u08_boi"]],"story":"s3u08"},{"id":"s3u09","title":"Around the Neighborhood","desc":"Find nearby places, say near or far, next to and in front of","guide":{"tips":["Grammar: kache = near, dure = far. To say where something is next to another place, add -er to the place and then the position word: dokaner shamne (in front of the shop), moshjider pashe (next to the mosque), golir sheshe (at the end of the lane).","People give distance in time, not kilometers: Rikshay dosh minit = ten minutes by rickshaw.","Elaka means area or neighborhood. Apnar basha kon elakay? is the usual way to ask where someone lives in a city.","The local tea stall (chayer dokan) is where neighbors meet, chat and catch up on news. It's a great place to practice Bangla.","Shamne is spelled with স but most Bangladeshis say it with an sh sound."],"phrases":["s3u09_dokan","s3u09_oshudh","s3u09_mosjid","s3u09_khub_kache","s3u09_koto_dur","s3u09_pashe","s3u09_shamne","s3u09_elaka"]},"lessons":[["s3u09_dokan","s3u09_khub_kache","s3u09_bajar","s3u09_mosjid"],["s3u09_koto_dur","s3u09_rikshay","s3u09_golir","s3u09_khub_kache"],["s3u09_oshudh","s3u09_pashe","s3u09_shamne","s3u09_dokan","s3u09_golir"],["s3u09_elaka","s3u09_basha_kache","s3u09_protibeshi","s3u09_koto_dur","s3u09_mosjid"],["s3u09_shanto","s3u09_chayer","s3u09_elaka","s3u09_pashe","s3u09_rikshay"]],"story":"s3u09"},{"id":"s3u10","title":"A Day in Dhaka","desc":"Plan a day, get around, and tell what you did — combining everything so far","guide":{"tips":["Grammar: You now have three tenses to mix. Past: gelam, korlen, chilo. Present: ache, jai. Future: korbo, jabo, firbo. Link steps with prothome (first) and tarpor (then): Prothome nasta korbo, tarpor bajare jabo.","In Dhaka, people call rickshaw and CNG drivers mama (uncle). Ask Mama, … jaben? before you get in, and settle the bhara (fare) first.","Jam (traffic jam) is part of every Dhaka plan. Ar kotokkhon lagbe? is the question you'll ask most in traffic.","Moja means both tasty and fun: Biriyanita khub moja chilo = the biryani was really tasty. Puran Dhaka (Old Dhaka) is famous for its biryani.","Inshallah (God willing) is added to almost any plan for the future, by most Bangladeshis."],"phrases":["s3u10_sharadin","s3u10_prothome","s3u10_mama_jaben","s3u10_bhara","s3u10_kotokkhon","s3u10_tarpor","s3u10_shomoy","s3u10_dinta","s3u10_inshallah"]},"lessons":[["s3u10_sharadin","s3u10_prothome","s3u10_dupure","s3u10_shondhay"],["s3u10_mama_jaben","s3u10_bhara","s3u10_jam_kom","s3u10_kotokkhon","s3u10_prothome"],["s3u10_puran_dhaka","s3u10_biriyani","s3u10_tarpor","s3u10_jam_kom","s3u10_sharadin"],["s3u10_shomoy","s3u10_ghurte","s3u10_dupure","s3u10_puran_dhaka","s3u10_bhara"],["s3u10_dinta","s3u10_inshallah","s3u10_tarpor","s3u10_shondhay","s3u10_ghurte"]],"story":"s3u10"}]},{"id":"s4","title":"Section 4 · Traveler","desc":"A2 · Transport, hotels, eating out, feelings, getting help","units":[{"id":"s4u01","title":"Bus, Train & Launch","desc":"Buy tickets, ask when things leave, find your seat and your stop","guide":{"tips":["Grammar: Bangla asks about timetables with the future tense. charbe = will leave, jabe = will go, ashbe = will come, thambe = will stop. The -be ending is for \"it / he / she\"; the -bo ending is for \"I / we\" (pabo, nambo, pouchabo).","Bus, train, ticket, seat and platform are used as everyday Bangla words. Add Bangla endings to them: ticketer = of the ticket, platforme = at the platform.","A launch is the big river ferry. Long-distance launches leave Dhaka's Sadarghat in the evening and arrive in the morning, so book a cabin or bring a mat for the deck.","On local buses the helper is often called \"mama\". When you want to get off, tell him \"Ami porer stope nambo\" (I'll get off at the next stop) in good time.","Ticket shesh literally means \"ticket finished\". It's what you'll hear before Eid, when tickets sell out fast."],"phrases":["s4u01_kothay_pabo","s4u01_charbe","s4u01_koytay","s4u01_ekta_ticket","s4u01_dam","s4u01_jabe","s4u01_seat_khali","s4u01_deri","s4u01_nambo"]},"lessons":[["s4u01_kothay_pabo","s4u01_ekta_ticket","s4u01_dam","s4u01_charbe"],["s4u01_kalker","s4u01_shesh","s4u01_koytay","s4u01_ekta_ticket","s4u01_charbe"],["s4u01_platform","s4u01_deri","s4u01_jabe","s4u01_koytay","s4u01_kothay_pabo"],["s4u01_seat_khali","s4u01_amar_seat","s4u01_thambe","s4u01_nambo","s4u01_jabe"],["s4u01_launch_ghat","s4u01_pouchabo","s4u01_deri","s4u01_dam","s4u01_seat_khali","s4u01_shesh"]],"story":"s4u01"},{"id":"s4u02","title":"Hotel & Guesthouse","desc":"Find a room, ask about the price, hot water and Wi-Fi, report problems, check out","guide":{"tips":["Grammar: To ask \"is there…?\" just put ache? after the thing: Gorom pani ache? = Is there hot water? To say something isn't working, use the present continuous with na: AC kaj korche na = The AC isn't working.","Hotel words are mostly English: room, booking, AC, Wi-Fi, checkout. Say them with Bangla endings: roomta = the room, bathroome = in the bathroom.","bhara means rent or fare: you'll hear it for a room, a flat, a rickshaw ride and a bus ticket.","Small guesthouses outside Dhaka may have power cuts. Many have a generator, and it's normal to ask about it.","Staff will call you sir or apni. Use apni with them too, and a polite din for requests."],"phrases":["s4u02_room_khali","s4u02_bhara","s4u02_dui_rat","s4u02_dekhte_pari","s4u02_gorom_pani","s4u02_nasta","s4u02_wifi","s4u02_ac_kaj","s4u02_checkout_koytay"]},"lessons":[["s4u02_room_khali","s4u02_booking","s4u02_bhara","s4u02_dui_rat"],["s4u02_dekhte_pari","s4u02_ac_room","s4u02_gorom_pani","s4u02_room_khali","s4u02_bhara"],["s4u02_nasta","s4u02_wifi","s4u02_checkout_koytay","s4u02_dui_rat","s4u02_gorom_pani"],["s4u02_chabi","s4u02_toyale","s4u02_checkout_korbo","s4u02_nasta","s4u02_dekhte_pari"],["s4u02_ac_kaj","s4u02_pani_ashche","s4u02_toyale","s4u02_wifi","s4u02_chabi","s4u02_ac_room"]],"story":"s4u02"},{"id":"s4u03","title":"Eating Out","desc":"Order at a restaurant, handle spicy food, praise the meal and ask for the bill","guide":{"tips":["Grammar: Add -ta to a noun to mean \"the\": bill → billta (the bill), menu → menuta (the menu), khabar → khabarta (the food). Then add din to ask for it politely: Billta din.","jhal means spicy-hot (chili heat), not temperature. gorom is for hot temperature. Jhal kom din is the most useful phrase in this unit.","Waiters are often called \"mama\" or \"bhai\" in casual eateries. In a nicer restaurant, a simple \"Bhai, shunun\" works.","Many restaurants have a hand-washing basin, because people eat rice with their right hand. Ask \"Hat dhoyar jayga kothay?\"","parcel is the Bangladeshi word for takeaway. Kacchi biryani, slow-cooked mutton with rice and potato, is a Dhaka favorite."],"phrases":["s4u03_menu","s4u03_ki_ki","s4u03_khub_jhal","s4u03_jhal_kom","s4u03_jhal_pari_na","s4u03_bhat_plate","s4u03_moja","s4u03_bill","s4u03_parcel"]},"lessons":[["s4u03_menu","s4u03_ki_ki","s4u03_kachchi","s4u03_pani_botol"],["s4u03_khub_jhal","s4u03_jhal_kom","s4u03_jhal_pari_na","s4u03_kachchi","s4u03_menu"],["s4u03_mangsho","s4u03_bhat_plate","s4u03_ar_ki_debo","s4u03_ki_ki","s4u03_jhal_kom"],["s4u03_moja","s4u03_hat_dhoyar","s4u03_parcel","s4u03_bhat_plate","s4u03_khub_jhal"],["s4u03_bill","s4u03_bill_ekhane","s4u03_moja","s4u03_ar_ki_debo","s4u03_parcel","s4u03_jhal_pari_na"]],"story":"s4u03"},{"id":"s4u04","title":"What Were You Doing?","desc":"Say what you were doing when something happened","guide":{"tips":["Grammar: The past continuous (\"was doing\") is built on the present continuous: korchi (I am doing) → korchilam (I was doing). Keep the korch- part and add the past endings: ami korchilam, tumi korchile, apni korchilen, o / she korchilo (he or she was doing).","Use it to set the scene when something else happened: Apni jokhon fon korlen, ami ghumacchilam = When you called, I was asleep. The interrupting event takes the simple past (korlen).","In Dhaka you'll often hear casual forms like \"kortesilam\" or \"ki kortesila\"; they're fine to understand, but stick with korchilam and korchile when you speak.","\"Ami namaj porchilam\" is a common and respected reason for missing a call. For Muslim prayer, Bangla uses porchi (reading / saying).","Bangladesh uses gosol for a bath or shower, and many people take one before the midday meal."],"phrases":["s4u04_apni_ki","s4u04_tumi_ki","s4u04_ghumacchilam","s4u04_tv","s4u04_ranna","s4u04_brishti","s4u04_fon_dhorlen","s4u04_jokhon","s4u04_kal_ei"]},"lessons":[["s4u04_apni_ki","s4u04_ghumacchilam","s4u04_tv","s4u04_ranna"],["s4u04_gosol","s4u04_namaj","s4u04_tumi_ki","s4u04_apni_ki","s4u04_tv"],["s4u04_cha","s4u04_bajar","s4u04_she_ki","s4u04_ranna","s4u04_tumi_ki"],["s4u04_brishti","s4u04_ki_hocchilo","s4u04_jacchile","s4u04_kal_ei","s4u04_gosol","s4u04_cha"],["s4u04_fon_dhorlen","s4u04_jokhon","s4u04_ghumacchilam","s4u04_namaj","s4u04_bajar","s4u04_she_ki"]],"story":"s4u04"},{"id":"s4u05","title":"Cricket & Hobbies","desc":"Talk about cricket, follow a match, and say what you do in your free time","guide":{"tips":["Grammar: To say you love or like doing something, put the verb in its -te form, then bhalobashi (love) or pochondo kori (like): porte bhalobashi = love reading, chobi tulte pochondo kori = like taking photos. It's the same -te form you used with chai and pari.","Cricket is Bangladesh's great passion. On a big match day, people crowd around TVs in tea stalls and shops. \"Score koto?\" is a fine way to start a chat with anyone.","Cricket talk is full of English words: score, team, support, out, run, wicket. chokka (six) and char (four) are the Bangla words you'll hear shouted most.","In Bangladesh, football means soccer. If you mean American football, say \"American football\".","khela means both a sport and a single game or match: Aj Bangladesher khela ache = Bangladesh plays today."],"phrases":["s4u05_cricket_dekhen","s4u05_khela_ache","s4u05_score","s4u05_ke_jitche","s4u05_priyo_ki","s4u05_obosor","s4u05_boi","s4u05_cholo_dekhi","s4u05_niyom"]},"lessons":[["s4u05_priyo_ki","s4u05_football","s4u05_cricket_dekhen","s4u05_team"],["s4u05_khela_ache","s4u05_score","s4u05_ke_jitche","s4u05_cricket_dekhen","s4u05_priyo_ki"],["s4u05_jitlo","s4u05_chokka","s4u05_niyom","s4u05_score","s4u05_team"],["s4u05_obosor","s4u05_boi","s4u05_chobi","s4u05_football","s4u05_niyom"],["s4u05_cholo_dekhi","s4u05_khelte_paro","s4u05_obosor","s4u05_chobi","s4u05_ke_jitche","s4u05_jitlo"]],"story":"s4u05"},{"id":"s4u06","title":"Feelings","desc":"Say how you feel — happy, sad, tired, worried, scared — and ask how others feel","guide":{"tips":["Grammar: Many feelings use amar + feeling + lagche (literally \"to me … is felt\"): Amar bhoy lagche = I'm scared, Amar rag lagche = I'm angry. Some are plain adjectives with ami: Ami khushi = I'm happy, Ami klanto = I'm tired. To say how someone looks, use apnake / tomake + lagche: Apnake klanto lagche = You look tired.","Mon kharap (literally \"bad mind\") is the everyday way to say you're sad or upset. Tomar ki mon kharap? is a caring question between friends.","Lojja means shyness or embarrassment. Amar lojja lagche is what you say when you feel shy or embarrassed, for example when everyone praises your Bangla.","\"Don't worry\" is Chinta korben na (polite) or Chinta koro na (casual). \"Don't be scared\" is Bhoy paben na (polite) or Bhoy peyo na (casual).","In casual Dhaka speech you'll hear lagtese / hoitese for lagche / hocche. Understand them, but say lagche and hocche."],"phrases":["s4u06_khushi","s4u06_mon_kharap","s4u06_klanto","s4u06_bhoy","s4u06_chinta","s4u06_lojja","s4u06_chinta_koro_na","s4u06_apnake_klanto","s4u06_ekhon_bhalo"]},"lessons":[["s4u06_khushi","s4u06_mon_kharap","s4u06_klanto","s4u06_ghum"],["s4u06_bhoy","s4u06_chinta","s4u06_lojja","s4u06_klanto","s4u06_mon_kharap"],["s4u06_tomar_mon","s4u06_keno_bhoy","s4u06_rag","s4u06_bhoy","s4u06_lojja"],["s4u06_apnake_klanto","s4u06_chinta_koro_na","s4u06_bhoy_paben_na","s4u06_chinta","s4u06_klanto"],["s4u06_ekhon_bhalo","s4u06_kichu_bhalo","s4u06_khushi","s4u06_rag","s4u06_chinta_koro_na"]],"story":"s4u06"},{"id":"s4u07","title":"Comparing","desc":"Say what's bigger, better, cheaper — and what's the best","guide":{"tips":["Grammar: To say \"than\", add -er to the thing you compare against and follow it with cheye: Eta oitar cheye bhalo = This is better than that one. Amar cheye lomba = taller than me. For \"the most / the -est\", use shobcheye: shobcheye bhalo = the best, shobcheye boro = the biggest / the oldest.","The adjective itself never changes: bhalo is good, better or best depending on cheye or shobcheye. Add beshi (more) or kom (less) if you like: beshi gorom = hotter, kom damer = cheaper.","Many Bangladeshis say theke instead of cheye (Eta oitar theke bhalo). Both are fine; this course uses cheye.","Boro and choto mean big and small, but for people they mean older and younger. Ami shobcheye choto = I'm the youngest (in my family).","Aro means \"even more\": Eta aro bhalo = This one is even better."],"phrases":["s4u07_eta_oitar","s4u07_konta","s4u07_shobcheye_bhalo","s4u07_aro","s4u07_lomba","s4u07_choto","s4u07_kom_dam","s4u07_ek_rokom"]},"lessons":[["s4u07_eta_oitar","s4u07_konta","s4u07_aro","s4u07_shobcheye_bhalo"],["s4u07_lomba","s4u07_ke_boro","s4u07_choto","s4u07_eta_oitar","s4u07_shobcheye_bhalo"],["s4u07_ingreji","s4u07_ranna","s4u07_kofi","s4u07_konta","s4u07_lomba"],["s4u07_dhaka","s4u07_gorom","s4u07_ilish","s4u07_choto","s4u07_kofi"],["s4u07_kom_dam","s4u07_ek_rokom","s4u07_aro","s4u07_ingreji","s4u07_dhaka"]],"story":"s4u07"},{"id":"s4u08","title":"The Village","desc":"Talk about the village home, rivers, fields and relatives back home","guide":{"tips":["Grammar: -er means \"of\" and -e / -y means \"in\", \"to\" or \"by\". gram (village) → gramer bari (village home), grame (in / to the village). nouka (boat) → noukay (by boat). Kumilla → Kumillay (in Cumilla).","Gramer bari (village home) is a big idea in Bangladesh: most people, even lifelong Dhaka residents, have a family home in a village or district town. Apnar gramer bari kothay? is a friendly, very common question.","Many families go home to the village for Eid and other holidays, so buses, trains and launches get packed at those times.","Relatives: dada / dadi = father's parents, nana / nani = mother's parents, chacha = father's brother, mama = mother's brother. Use the polite verb (thaken) for elders.","Current (said \"karent\") is the everyday word for electricity. Current nei = the power is out."],"phrases":["s4u08_apnar_gram","s4u08_gramer_bari","s4u08_koto_dur","s4u08_chutite","s4u08_dada_dadi","s4u08_nodi","s4u08_khet","s4u08_shanti","s4u08_antorik"]},"lessons":[["s4u08_apnar_gram","s4u08_gramer_bari","s4u08_koto_dur","s4u08_rasta"],["s4u08_chutite","s4u08_dada_dadi","s4u08_chacha","s4u08_apnar_gram","s4u08_gramer_bari"],["s4u08_nodi","s4u08_khet","s4u08_nouka","s4u08_koto_dur","s4u08_chutite"],["s4u08_shanti","s4u08_taja","s4u08_antorik","s4u08_nodi","s4u08_dada_dadi"],["s4u08_pukur","s4u08_karent","s4u08_rasta","s4u08_khet","s4u08_shanti"]],"story":"s4u08"},{"id":"s4u09","title":"Could You…?","desc":"Ask for favors politely, and say yes or no to requests","guide":{"tips":["Grammar: To ask \"could you …?\", put the verb in its -te form and add parben? (polite) or parbe? (casual): bolte parben? = could you say it?, ante parbe? = could you bring it? Ektu (a little) in front makes any request softer.","Doya kore means \"please\", but it sounds fairly formal. In everyday speech, ektu plus a polite tone does most of the work.","Saying yes: Ji, obosshoi (Yes, of course) or Kono shomossha nei (No problem). Saying no gently: Dukkhito, ekhon parbo na (Sorry, I can't right now).","Fon dewa (literally \"give a phone\") is the everyday Bangladeshi way to say \"call someone\": Pore fon dite parben? = Could you call later?","Among friends, short forms are common: Fonta ektu dibe? (Can I have the phone a sec?). In Bangladesh you'll hear dibe more often than the textbook debe."],"phrases":["s4u09_shahajjo","s4u09_obosshoi","s4u09_shomossha","s4u09_parbo_na","s4u09_arekbar","s4u09_aste","s4u09_chobi","s4u09_rasta","s4u09_cha_ante"]},"lessons":[["s4u09_shahajjo","s4u09_obosshoi","s4u09_shomossha","s4u09_parbo_na"],["s4u09_arekbar","s4u09_aste","s4u09_opekkha","s4u09_shahajjo","s4u09_obosshoi"],["s4u09_chobi","s4u09_rasta","s4u09_dhorte","s4u09_aste","s4u09_shomossha"],["s4u09_janala","s4u09_jayga","s4u09_pore_fon","s4u09_opekkha","s4u09_parbo_na"],["s4u09_cha_ante","s4u09_fon","s4u09_chobi","s4u09_rasta","s4u09_obosshoi"]],"story":"s4u09"},{"id":"s4u10","title":"Getting Help","desc":"Stay calm and get help when you're lost, sick or in trouble","guide":{"tips":["Grammar: dorkar means \"need\". Say who needs it with amar (my), then the thing, then dorkar: Amar ekjon daktar dorkar = I need a doctor. Amar pani dorkar = I need water.","Polite commands end in -un: dakun (call), korun (do), thakun (stay). In an emergency, calm and polite gets faster help than loud.","Bangladesh's national emergency number is 999 (police, fire service and ambulance), free from any phone.","Lost? Say Ami rasta hariye felechi (I'm lost). Learn it as a set phrase for now; the -echi ending (\"have done\") is taught in Section 5. Save the address where you're staying on your phone, show it and say Ami ei thikanay jete chai.","Bachao! is a shout for real danger. For everyday trouble, start with Maf korben (excuse me) and Doya kore amake shahajjo korun."],"phrases":["s4u10_bachao","s4u10_shahajjo_korun","s4u10_thik_achen","s4u10_hariye","s4u10_kothay_achi","s4u10_thikana","s4u10_daktar","s4u10_hashpatal","s4u10_shanto","s4u10_pulish"]},"lessons":[["s4u10_bachao","s4u10_shahajjo_korun","s4u10_thik_achen","s4u10_thik_achi"],["s4u10_hariye","s4u10_kothay_achi","s4u10_thikana","s4u10_shahajjo_korun","s4u10_thik_achen"],["s4u10_bondhu","s4u10_daktar","s4u10_hashpatal","s4u10_thik_achi","s4u10_kothay_achi"],["s4u10_hashpatale_nite","s4u10_ambulance","s4u10_shanto","s4u10_daktar","s4u10_bondhu"],["s4u10_pulish","s4u10_thana","s4u10_fon","s4u10_bachao","s4u10_shanto","s4u10_hariye"]],"story":"s4u10"}]},{"id
