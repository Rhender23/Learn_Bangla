":"s5","title":"Section 5 · Explorer","desc":"A2 · Festivals, weddings, the doctor, renting, monsoon","units":[{"id":"s5u01","title":"Eid & Festivals","desc":"Greet people at Eid, Pohela Boishakh and Durga Puja, and talk about what people do","guide":{"tips":["Grammar: -er means \"of\" and -e means \"at / in / on\". Eider chuti = the Eid holidays, Eider namaj = the Eid prayer, Eide = at Eid, Romjane = in Ramadan, Pohela Boishakhe = on Pohela Boishakh. After a vowel -er shrinks to -r: Puja → Pujar shomoy (Puja time).","Bangladesh has two Eids. Eid-ul-Fitr ends the month of Ramadan (Romjan), when many people fast (roja rakhe): people eat shemai and give children Eid money called salami. Eid-ul-Adha is usually called Korbanir Eid: families who can afford it sacrifice a cow or goat and share the meat with relatives and the poor.","The Eid date depends on the moon sighting, so the exact day is only confirmed the evening before. Huge numbers of people leave the cities to go home (bari) to their villages for the Eid holidays.","Pohela Boishakh (14 April) is the Bangla New Year, celebrated by people of every faith with fairs, music and red-and-white clothes. Greet everyone with Shubho noboborsho!","Durga Puja is the biggest Hindu festival in Bangladesh. Wish Hindu friends Pujar shubheccha; after the last day (Bijoya Doshomi) people say Shubho Bijoya. Visitors go from mondop to mondop (pandal to pandal) to see the decorated images."],"phrases":["s5u01_eid_mubarak","s5u01_apnakeo","s5u01_shubhechcha","s5u01_katlo","s5u01_shemai","s5u01_chutite","s5u01_noboborsho","s5u01_pujar_shubhechcha"]},"lessons":[["s5u01_eid_mubarak","s5u01_apnakeo","s5u01_eid_kobe","s5u01_shemai"],["s5u01_shubhechcha","s5u01_katlo","s5u01_namaj","s5u01_eid_mubarak","s5u01_apnakeo"],["s5u01_chutite","s5u01_salami","s5u01_roja","s5u01_shemai","s5u01_eid_kobe"],["s5u01_korbani","s5u01_noboborsho","s5u01_lal_shada","s5u01_katlo","s5u01_namaj"],["s5u01_pujar_shubhechcha","s5u01_mondop","s5u01_noboborsho","s5u01_chutite","s5u01_shubhechcha"]],"story":"s5u01"},{"id":"s5u02","title":"Weddings","desc":"Get invited, talk about the gaye holud, compliment the bride, and give a gift","guide":{"tips":["Grammar: one verb covers events: hoy (happens), hocche (is happening), hobe (will happen), holo (happened). Biye kobe hobe? = When will the wedding be? Biye kemon holo? = How did the wedding go?","\"Apnar dawat roilo\" is the warm, standard way to invite someone: literally \"your invitation remains\". Answer with thanks and a promise to come.","The gaye holud (\"turmeric on the body\") is a colorful party before the wedding: family and friends rub turmeric paste on the bride or groom, there is music and food, and guests often dress in yellow, orange or green.","Cousins have specific words: chachato (father's brother's child), fufato (father's sister's), mamato (mother's brother's), khalato (mother's sister's). In English they are all just \"cousin\" — and often simply called bhai or bon.","Expect to be asked \"Apni kobe biye korben?\" — it's friendly curiosity, not rudeness. A smile and \"Ekhono jani na!\" works fine. Cash in an envelope or a household gift are both common wedding presents."],"phrases":["s5u02_biye_kobe","s5u02_dawat","s5u02_gaye_holud","s5u02_kone","s5u02_upohar","s5u02_shubho_kamona","s5u02_khawa","s5u02_kobe_korben"]},"lessons":[["s5u02_chachato","s5u02_biye_kobe","s5u02_dawat","s5u02_biyebari"],["s5u02_gaye_holud","s5u02_holud_shari","s5u02_kachchi","s5u02_biye_kobe","s5u02_dawat"],["s5u02_bor","s5u02_kone","s5u02_borer_bondhu","s5u02_biyebari","s5u02_gaye_holud"],["s5u02_upohar","s5u02_shubho_kamona","s5u02_kobe_korben","s5u02_kone","s5u02_chachato"],["s5u02_khawa","s5u02_biye_kemon","s5u02_kachchi","s5u02_upohar","s5u02_holud_shari"]],"story":"s5u02"},{"id":"s5u03","title":"Have You Ever…?","desc":"Ask and say what you have and haven't done, and how many times","guide":{"tips":["Grammar: for \"have done\", add -echi (I), -echen (polite you), -echo (casual you) or -eche (he / she): kheyechi = I have eaten, giyechen? = have you been? For \"haven't\", use the plain present + ni: khaini (haven't eaten), jaini (haven't gone), korini (haven't done).","Kokhono = ever. In a question it means \"ever\"; with a ni-verb it means \"never\": Ami kokhono jaini = I've never been. Ekhono + ni = not yet: Ami ekhono khaini.","-bar means \"times\": ekbar (once), duibar (twice), koyekbar (a few times), onekbar (many times), kotobar? (how many times?).","\"Apni kheyechen?\" (Have you eaten?) is also a warm, caring check-in, like asking how someone is doing.","You'll often hear the short form gechi for giyechi — both are fine. Casual Dhaka speech also says khaisi / gesi; understand them, but keep using the standard forms."],"phrases":["s5u03_sylhet","s5u03_jaini","s5u03_giyechi","s5u03_onekbar","s5u03_kheyechen","s5u03_khaini","s5u03_ilish","s5u03_dekhini","s5u03_korini"]},"lessons":[["s5u03_kheyechen","s5u03_khaini","s5u03_sylhet","s5u03_jaini"],["s5u03_giyechi","s5u03_onekbar","s5u03_kotobar","s5u03_sylhet","s5u03_jaini"],["s5u03_ilish","s5u03_ekbar","s5u03_dekhini","s5u03_kheyechen","s5u03_onekbar"],["s5u03_ganta","s5u03_nouka","s5u03_america","s5u03_giyechi","s5u03_dekhini"],["s5u03_kaj_shesh","s5u03_korini","s5u03_ilish","s5u03_ganta","s5u03_khaini"]],"story":"s5u03"},{"id":"s5u04","title":"At the Doctor","desc":"Describe symptoms, say how long, and understand the doctor's instructions","guide":{"tips":["Grammar: dhore after a time means \"for\": tin din dhore = for three days, ek shoptaho dhore = for a week. Bangla uses the present for something still going on, so \"Amar tin din dhore jor\" = I've had a fever for three days (and still do).","In Bangla you \"eat\" medicine and water: oshudh khawa, pani khawa. So the doctor says \"khaben\" for take / drink.","Many doctors \"sit\" (boshen) in a private chamber at fixed hours, often in the evening, so ask \"Daktar kokhon boshen?\" before you go. Address the doctor respectfully as daktar shaheb.","Oshudher dokan (pharmacies) are everywhere in Bangladesh, and the pharmacist will often give advice — but for a fever lasting days, see a doctor."],"phrases":["s5u04_boshen","s5u04_jor","s5u04_koto_din","s5u04_shoptah","s5u04_ruchi","s5u04_khacchen","s5u04_tinbar","s5u04_khawar_pore","s5u04_dokan"]},"lessons":[["s5u04_boshen","s5u04_ki_hoyeche","s5u04_jor","s5u04_koto_din"],["s5u04_bomi","s5u04_shoptah","s5u04_ruchi","s5u04_jor","s5u04_ki_hoyeche"],["s5u04_ghum","s5u04_rate_jor","s5u04_khacchen","s5u04_koto_din","s5u04_shoptah"],["s5u04_tinbar","s5u04_khawar_pore","s5u04_abar_ashben","s5u04_khacchen","s5u04_boshen"],["s5u04_pani","s5u04_dokan","s5u04_tinbar","s5u04_bomi","s5u04_ghum","s5u04_rate_jor"]],"story":"s5u04"},{"id":"s5u05","title":"Renting a Place","desc":"Look for a flat, ask about rent, rooms and bills, and talk to the landlord","guide":{"tips":["Grammar: add -e to a time word to mean \"per / in\": mash (month) → mashe (per month), din → dine (per day). Bhara mashe koto? = How much is the rent per month? For \"including\" put shoho after the noun; for \"without\" put chara after it: bill shoho, bill chara.","Basha is the flat or house you live in now; bari is a house or your family home (often in the village). Bariwala is the landlord — literally \"the house person\".","In Dhaka, look for \"To-Let\" signs on gates. Landlords usually ask for an advance before you move in, and bills for gas, water and electricity may or may not be included — always ask \"Bill shoho naki bill chara?\"","Floors are tola: char tolay = on the fourth floor. Uthte (literally \"to go up\") is the everyday word for moving in.","Some landlords prefer renting to families, so it helps to say up front if you'll live alone: Ami eka thakbo."],"phrases":["s5u05_khujchi","s5u05_khali","s5u05_dekhte","s5u05_mashe_koto","s5u05_ghor","s5u05_bill","s5u05_uthte","s5u05_kol","s5u05_bolbo"]},"lessons":[["s5u05_khujchi","s5u05_khali","s5u05_dekhte","s5u05_mashe_koto"],["s5u05_ghor","s5u05_tolay","s5u05_lift","s5u05_dekhte","s5u05_mashe_koto"],["s5u05_bill","s5u05_alada","s5u05_pani","s5u05_ghor","s5u05_khali"],["s5u05_bariwala","s5u05_eka","s5u05_uthte","s5u05_bill","s5u05_khujchi"],["s5u05_kol","s5u05_bolbo","s5u05_bariwala","s5u05_pani","s5u05_alada"]],"story":"s5u05"},{"id":"s5u06","title":"One Thing, Then Another","desc":"Join two actions in one sentence: eat and go, wash and sit, think and tell","guide":{"tips":["Grammar: To do one thing and then another, put the first verb in its \"-e\" form: kora → kore, khawa → kheye, dhowa → dhuye, shona → shune, otha → uthe, bhaba → bhebe. Jawa (go) is irregular: giye. Only the last verb shows the tense: Ami nasta kheye office jabo = I'll eat breakfast, then go to the office.","The \"-e\" form also works like English \"by\" or \"on\": rikshay kore = by rickshaw, hete = on foot.","Ashchi literally means \"I'm coming\", but people use it to say \"I'll be right there / right back\": Mukh dhuye ashchi.","Cha kheye jan is classic Bangladeshi hospitality. Hosts say it when a guest gets up to leave; accepting a quick cup is the polite thing to do.","Many Bangladeshi homes are shoes-off. If you see shoes by the door, take yours off too."],"phrases":["s5u06_nasta_office","s5u06_bari_giye","s5u06_cha_kheye","s5u06_hat_dhuye","s5u06_juta","s5u06_kaj_shesh","s5u06_shune","s5u06_bhebe"]},"lessons":[["s5u06_nasta_office","s5u06_gosol","s5u06_ghum","s5u06_bari_giye"],["s5u06_hat_dhuye","s5u06_cha_kheye","s5u06_juta","s5u06_gosol","s5u06_nasta_office"],["s5u06_dokane","s5u06_kaj_shesh","s5u06_mukh","s5u06_bari_giye","s5u06_ghum"],["s5u06_shune","s5u06_rikshay","s5u06_kheye_eshecho","s5u06_cha_kheye","s5u06_juta"],["s5u06_hete","s5u06_bhebe","s5u06_dokane","s5u06_shune","s5u06_kaj_shesh","s5u06_rikshay"]],"story":"s5u06"},{"id":"s5u07","title":"Monsoon","desc":"Talk about heavy rain, flooding, power cuts and staying safe","guide":{"tips":["Grammar: An \"-e\" verb + geche / gechi describes a change that has already happened and still holds: bhije gechi = I've got soaked, jome geche = (water) has built up, chole geche = has gone. Use gechi for \"I\" and geche for he / she / it.","Borshakal (monsoon) runs roughly June to September. Rain can be very heavy, and many Dhaka streets fill with water quickly.","Megh dakche literally means \"the clouds are calling\" — that's how Bangla says thunder.","Current (said \"karent\", from English) is the everyday word for electricity; bidyut is the formal word. Current chole geche = the power has gone out. You'll also hear \"load shedding\" for power cuts.","In Bangla you \"eat\" water and tea (khawa), so Pani futiye khaben = boil the water before you drink it."],"phrases":["s5u07_jore","s5u07_borshakale","s5u07_megh","s5u07_chata","s5u07_bhije","s5u07_pani_jome","s5u07_bhetore","s5u07_current","s5u07_futiye"]},"lessons":[["s5u07_borshakale","s5u07_jore","s5u07_sharadin","s5u07_megh"],["s5u07_biddut","s5u07_chata","s5u07_bhetore","s5u07_jore","s5u07_megh"],["s5u07_bhije","s5u07_pani_jome","s5u07_kada","s5u07_chata","s5u07_sharadin"],["s5u07_thamar_por","s5u07_current","s5u07_kapor","s5u07_bhije","s5u07_biddut"],["s5u07_bonna","s5u07_futiye","s5u07_pani_jome","s5u07_bhetore","s5u07_current","s5u07_borshakale"]],"story":"s5u07"},{"id":"s5u08","title":"Clothes Shopping","desc":"Buy a panjabi or sari, ask about sizes and colors, and get clothes altered at the tailor","guide":{"tips":["Grammar: Add -ta to a noun to mean \"the\" one you are pointing at: panjabi → panjabita, shari → sharita, rong → rongta. With ei it means \"this one\": ei panjabita = this panjabi. And \"... kore din\" asks someone to do something for you: choto kore din = make it shorter for me, pack kore din = wrap it for me.","A panjabi is the long tunic many men wear for Eid, Friday prayers and weddings. Women's everyday wear is the sari or salwar kameez.","Many people buy fabric and have clothes made by a tailor (dorji). Expect to be measured (map) and to come back in a few days.","Malls and brand shops usually have fixed prices; in markets, ask Dam ki fixed? and bargain politely if it isn't.","Shopkeepers love to say Ei rongta apnake khub manabe — it's sales talk, but also a normal compliment."],"phrases":["s5u08_panjabita","s5u08_onno_rong","s5u08_boro_size","s5u08_choto","s5u08_pore_dekhi","s5u08_fixed","s5u08_hata","s5u08_banate","s5u08_manabe"]},"lessons":[["s5u08_panjabita","s5u08_onno_rong","s5u08_fixed","s5u08_eid"],["s5u08_sharita","s5u08_manabe","s5u08_rong_uthe","s5u08_panjabita","s5u08_onno_rong"],["s5u08_boro_size","s5u08_choto","s5u08_pore_dekhi","s5u08_sharita","s5u08_eid"],["s5u08_map","s5u08_hata","s5u08_banate","s5u08_choto","s5u08_fixed"],["s5u08_trial","s5u08_pack","s5u08_manabe","s5u08_pore_dekhi","s5u08_banate","s5u08_boro_size"]],"story":"s5u08"},{"id":"s5u09","title":"Advice","desc":"Give and ask for advice: you should, you shouldn't, it's better to","guide":{"tips":["Grammar: \"Should\" is uchit. The person goes in the -r form (amar, tomar, apnar), then the verbal noun (kora, jawa, khawa, newa, dekhano), then uchit: Apnar daktar dekhano uchit = You should see a doctor. Add na for \"shouldn't\" (uchit na) and chilo for \"should have\" (uchit chilo).","A softer way to advise is verbal noun + bhalo, \"it's better to ...\": Shokale jawa bhalo = It's better to go in the morning.","Advice can also be a simple command: Taratari ghumiye poro (casual) or Age theke ticket kete rakhun (polite). In Bangladesh you \"cut\" a ticket: ticket kata = buy a ticket.","Bangladeshis give advice freely, especially about health and food. It's a sign of care, not of being bossy.","Shabdhane thakben is a warm way to say goodbye to someone heading off on a trip; the casual form is Shabdhane theko."],"phrases":["s5u09_daktar","s5u09_bishram","s5u09_ki_kora","s5u09_rate","s5u09_chinta","s5u09_shokale","s5u09_shabdhane","s5u09_shona"]},"lessons":[["s5u09_daktar","s5u09_bishram","s5u09_ki_kora","s5u09_rate"],["s5u09_ammu","s5u09_ghumiye","s5u09_daktar","s5u09_ki_kora","s5u09_rate"],["s5u09_chinta","s5u09_shokale","s5u09_rastar","s5u09_rate","s5u09_bishram"],["s5u09_ticket","s5u09_shabdhane","s5u09_poramorsho","s5u09_ammu","s5u09_shokale"],["s5u09_practice","s5u09_shona","s5u09_chinta","s5u09_rastar","s5u09_ghumiye","s5u09_poramorsho"]],"story":"s5u09"},{"id":"s5u10","title":"Mobile Life","desc":"Recharge your phone, deal with bad internet, send messages and money by mobile banking","guide":{"tips":["Grammar: Most phone words come straight from English and get a Bangla verb: recharge korbo (I'll recharge), check korun (please check), video kol korbo (I'll video call). Add -e for \"on / in / by\": fone (on the phone), nombore (to the number), bankinge (by banking).","Most Bangladeshis use prepaid phones. Small shops everywhere will top up your number: just say Ei nombore eksho taka recharge kore din.","Mobile banking is how many people send and receive money, pay shops and split bills. After sending, people say Taka pathiyechi, check korun.","Message dio / fon dio literally say \"give a message / give a call\" — that's the normal way to say \"send\" or \"call\" in casual speech.","Rob may also hear \"net nei\" for \"no internet\" and \"MB shesh\" when someone's data has run out."],"phrases":["s5u10_balance","s5u10_eksho","s5u10_slow","s5u10_network","s5u10_charge","s5u10_message_dio","s5u10_mobile_banking","s5u10_pathiyechi","s5u10_peyechen"]},"lessons":[["s5u10_charge","s5u10_network","s5u10_slow","s5u10_charger"],["s5u10_balance","s5u10_ponchash","s5u10_eksho","s5u10_charge","s5u10_network"],["s5u10_message_dio","s5u10_chobi","s5u10_video","s5u10_charger","s5u10_slow"],["s5u10_nomborta","s5u10_dekhechen","s5u10_mobile_banking","s5u10_message_dio","s5u10_balance"],["s5u10_pathiyechi","s5u10_peyechen","s5u10_mobile_banking","s5u10_eksho","s5u10_chobi","s5u10_nomborta"]],"story":"s5u10"}]},{"id":"s6","title":"Section 6 · Intermediate","desc":"B1 · Opinions, conditionals, office life, explaining reasons","units":[{"id":"s6u01","title":"Opinions","desc":"Say what you think, ask others' opinions, and talk about plans you're considering","guide":{"tips":["Grammar: Amar mone hoy = I think (literally \"in my mind it seems\"). Put it in front of any sentence: Amar mone hoy aj brishti hobe. Ami mone kori is a firmer \"I believe\", and ami bhabchi = I'm thinking of (doing something).","Ask for someone's view with Apnar ki mone hoy? (polite) or Tomar ki mone hoy? (casual). To say \"I don't think so\", put na at the very end: Amar mone hoy na.","Amar kache = to me / in my view. Amar kache khub bhalo legeche = I really liked it. Amar mote (in my opinion) sounds a little more formal.","Shotti bolte (to be honest) softens a negative opinion. Bangladeshis usually say something kind first and criticize gently.","Food, cricket and the weather are the classic topics for friendly opinions. With people you've just met, leave politics and religion alone."],"phrases":["s6u01_apnar_ki","s6u01_ke_jitbe","s6u01_brishti","s6u01_mone_hoy_na","s6u01_nishchit","s6u01_mote","s6u01_legeche","s6u01_bhabchi","s6u01_bhabini"]},"lessons":[["s6u01_apnar_ki","s6u01_mone_hoy_na","s6u01_brishti","s6u01_nishchit"],["s6u01_ke_jitbe","s6u01_jitbe","s6u01_mote","s6u01_apnar_ki","s6u01_nishchit"],["s6u01_kache","s6u01_shotti","s6u01_legeche","s6u01_mote","s6u01_mone_hoy_na"],["s6u01_boita","s6u01_mone_kori","s6u01_bhabchi","s6u01_legeche","s6u01_jitbe"],["s6u01_bhabchilam","s6u01_bhabini","s6u01_bhabchi","s6u01_shotti","s6u01_brishti"]],"story":"s6u01"},{"id":"s6u02","title":"Agreeing & Disagreeing","desc":"Agree, disagree politely, and settle a friendly argument","guide":{"tips":["Grammar: ekmot = of one opinion. Ami apnar shathe ekmot = I agree with you. To disagree, put na after it: Ami ekmot na. The more formal standard form is ami ekmot noi; you'll hear both.","Thik bolechen / thik bolecho (literally \"you said right\") is the everyday \"you're right\": -chen for apni, -cho for tumi.","Disagree softly: start with Apnar kotha thik, kintu... or Ami eta ektu onnobhabe dekhi. Flat contradiction can sound rude, especially to elders.","Tobe also means \"but\", and it's gentler than kintu: Puropuri ekmot na, tobe kichuta thik.","Eta niye = about this. Eta niye torko kore labh nei is a friendly way to end an argument."],"phrases":["s6u02_ekmot","s6u02_ekmot_na","s6u02_bolechen","s6u02_ekdom","s6u02_amio","s6u02_kotha_thik","s6u02_onnobhabe","s6u02_torko","s6u02_bhebe"]},"lessons":[["s6u02_ekmot","s6u02_bolechen","s6u02_ekmot_na","s6u02_amio"],["s6u02_puropuri","s6u02_tumi_ekmot","s6u02_ekdom","s6u02_ekmot","s6u02_bolechen"],["s6u02_ta_na","s6u02_kotha_thik","s6u02_onnobhabe","s6u02_ekmot_na","s6u02_amio"],["s6u02_tobe","s6u02_torko","s6u02_motamot","s6u02_onnobhabe","s6u02_tumi_ekmot"],["s6u02_bhebe","s6u02_kothai","s6u02_kotha_thik","s6u02_torko","s6u02_puropuri"]],"story":"s6u02"},{"id":"s6u03","title":"If…, Then…","desc":"Make plans that depend on something: if it rains, if I get time, if you want","guide":{"tips":["Grammar: jodi (if) + a present-tense verb, then tahole (then) + the result: Jodi brishti hoy, tahole amra bashay thakbo. The verb after jodi stays in the present even for the future: jodi shomoy pai (if I get time), not pabo.","Jodi can also come after the subject (Rob jodi ashe...), and tahole is often dropped: Jodi kichu lage, amake bolben.","Shortcut: instead of jodi, add -le to the verb: hoy becomes hole, thake becomes thakle, lage becomes lagle. Dam kom hole kinbo = if it's cheaper, I'll buy it.","Tahole on its own means \"so / in that case\": Tahole ekhon ki korbo? = So what do we do now?","Jodi bhul boli, amake thik kore diben is a great line for a learner; people are happy to help. You'll also hear deben instead of diben."],"phrases":["s6u03_brishti","s6u03_shomoy","s6u03_chao","s6u03_lage","s6u03_hole","s6u03_na_pari","s6u03_bhul","s6u03_tahole_ki","s6u03_na_hoy"]},"lessons":[["s6u03_brishti","s6u03_shomoy","s6u03_deri","s6u03_tahole_ki"],["s6u03_chao","s6u03_lage","s6u03_na_pari","s6u03_brishti","s6u03_tahole_ki"],["s6u03_rasta","s6u03_janio","s6u03_hole","s6u03_deri","s6u03_shomoy"],["s6u03_bhul","s6u03_khide","s6u03_chuti","s6u03_hole","s6u03_na_pari"],["s6u03_na_hoy","s6u03_cholo","s6u03_rasta","s6u03_chuti","s6u03_chao"]],"story":"s6u03"},{"id":"s6u04","title":"Office Life","desc":"Meetings, deadlines, reports, leave and colleagues at a Bangladeshi office","guide":{"tips":["Grammar: -te hobe = have to / must. Shesh korte hobe = (it) has to be finished. Lagbe = will take / will be needed: Kajta shesh hote ar dui din lagbe; Amar ek diner chuti lagbe.","Office Bangla is full of English words: meeting, deadline, report, email, update. Say them with Bangla sounds and add Bangla endings: reportta = the report.","Bangladeshi offices usually call the boss Sir (or Madam / Apa for a woman), even when talking about them: Sir aj ashenni. Note the respectful -en ending: ashenni, not asheni.","Colleagues normally use apni with each other and add bhai or apa after a first name: Rob bhai, Farhana apa. You'll also hear the English loan kolig for colleague.","Ajker moto kaj shesh is the cheerful way to say you're done for the day."],"phrases":["s6u04_meeting","s6u04_pichiye","s6u04_deadline","s6u04_brihoshpoti","s6u04_besto","s6u04_chuti","s6u04_age","s6u04_update","s6u04_ajker_moto"]},"lessons":[["s6u04_meeting","s6u04_pichiye","s6u04_deadline","s6u04_update"],["s6u04_brihoshpoti","s6u04_report","s6u04_email","s6u04_deadline","s6u04_meeting"],["s6u04_besto","s6u04_sir","s6u04_duidin","s6u04_pichiye","s6u04_brihoshpoti"],["s6u04_chuti","s6u04_age","s6u04_bishoye","s6u04_besto","s6u04_report"],["s6u04_shohokormi","s6u04_ajker_moto","s6u04_update","s6u04_duidin","s6u04_age"]],"story":"s6u04"},{"id":"s6u05","title":"Food Culture","desc":"Talk about Bangladeshi dishes and follow a recipe step by step","guide":{"tips":["Grammar: recipes chain steps with the -e linking form you learned earlier, then end with a polite command: kuchi kore katun (chop finely), bheje nin (fry it up), koshiye nin (sauté it), komiye rakhun (turn it down and leave it), chitiye din (sprinkle it on).","Koshano, frying spices and meat until the oil separates, is the heart of a Bangladeshi curry. Bhalo kore koshiye nin = sauté it well (polite).","Jhal = spicy hot, moshla = spices, lobon = salt. Bangladeshis say lobon for salt and dhoniya pata for coriander leaves.","Bhorta are mashed dishes (potato, eggplant, dried fish) mixed with mustard oil, onion and green chili. Pitha are rice cakes, a winter favorite.","Always praise the cook. Khub mojar hoyeche! (It turned out delicious!) goes a long way."],"phrases":["s6u05_kibhabe","s6u05_peyaj","s6u05_bheje","s6u05_koshan","s6u05_chula","s6u05_jhal","s6u05_chekhe","s6u05_nijei","s6u05_bhorta"]},"lessons":[["s6u05_kibhabe","s6u05_peyaj","s6u05_bheje","s6u05_shorisha"],["s6u05_koshan","s6u05_chula","s6u05_bhorta","s6u05_peyaj","s6u05_kibhabe"],["s6u05_jhal","s6u05_chekhe","s6u05_moshla","s6u05_bheje","s6u05_koshan"],["s6u05_nijei","s6u05_ammu","s6u05_pitha","s6u05_shorisha","s6u05_jhal"],["s6u05_biriyani","s6u05_dhoniya","s6u05_chula","s6u05_chekhe","s6u05_bhorta"]],"story":"s6u05"},{"id":"s6u06","title":"Friendship & Relationships","desc":"Talk about friends, family ties, trust and falling out","guide":{"tips":["Grammar: When a person is the object, add -ke: amake (me), tomake (you, casual), take (him/her), kauke (anyone). Ami take bishshash kori = I trust him. To say \"with someone\", use -er shathe: or shathe (with him), bhaier shathe (with my brother).","Adda dewa means hanging out and chatting for hours, usually over tea. It is a much-loved part of life in Bangladesh.","Kotha dicchi literally means \"I'm giving my word\". It is the everyday way to say \"I promise\".","Many Bangladeshis grow up in a joutho poribar (joint family), with grandparents, uncles and cousins under one roof. Family opinions matter a lot in big decisions.","Mon kharap (bad mind) means sad or upset; mon halka holo (my mind got lighter) means you feel better after sharing something."],"phrases":["s6u06_chotobela","s6u06_bochor","s6u06_porichoy","s6u06_bishshash","s6u06_kotha_dicchi","s6u06_pashe","s6u06_kacher","s6u06_adda","s6u06_rag"]},"lessons":[["s6u06_chotobela","s6u06_bochor","s6u06_kacher","s6u06_adda"],["s6u06_porichoy","s6u06_ekshathe","s6u06_shomporko","s6u06_chotobela","s6u06_bochor"],["s6u06_joutho","s6u06_jhogra","s6u06_kotha_hoy_na","s6u06_shomporko","s6u06_adda"],["s6u06_bishshash","s6u06_amake","s6u06_kotha_dicchi","s6u06_kotha_hoy_na","s6u06_kacher"],["s6u06_pashe","s6u06_halka","s6u06_rag","s6u06_bishshash","s6u06_jhogra","s6u06_porichoy"]],"story":"s6u06"},{"id":"s6u07","title":"Describing People","desc":"Say what someone looks like and what kind of person they are","guide":{"tips":["Grammar: dekhte means \"in looks\": Uni dekhte kemon? = What does he look like? Add -er moto for \"like\": mayer moto = like his mother. Put pora (wearing) after the clothing to point someone out: lal shari pora mohila = the woman wearing a red sari.","Uni is the polite \"he/she\" for elders and people you respect; o is the casual one for friends, children and younger people. The verb changes too: uni poren, o pore.","Bangla has no separate words for he and she, so uni and o can mean either. The situation tells you which.","Describe people by clothes, glasses, hair, age or personality. Comments about someone's skin color or weight are common to hear but are hurtful, so don't copy them.","Manush hishebe (as a person) is a natural way to praise someone's character: Manush hishebe uni khub bhalo."],"phrases":["s6u07_dekhte_kemon","s6u07_lomba_choshma","s6u07_mayer_moto","s6u07_manush_hishebe","s6u07_lajuk","s6u07_mishuk","s6u07_lal_shari","s6u07_nil_shart","s6u07_boyoshe"]},"lessons":[["s6u07_dekhte_kemon","s6u07_lomba_choshma","s6u07_chul","s6u07_dari"],["s6u07_mayer_moto","s6u07_boyoshe","s6u07_lal_shari","s6u07_dekhte_kemon","s6u07_chul"],["s6u07_nil_shart","s6u07_manush_hishebe","s6u07_porishromi","s6u07_lal_shari","s6u07_mayer_moto"],["s6u07_lajuk","s6u07_mishuk","s6u07_mojar","s6u07_manush_hishebe","s6u07_lomba_choshma"],["s6u07_mejaj","s6u07_shohoj_shorol","s6u07_lajuk","s6u07_mishuk","s6u07_nil_shart","s6u07_boyoshe"]],"story":"s6u07"},{"id":"s6u08","title":"Hopes & Ambitions","desc":"Talk about dreams, wishes and plans for the future","guide":{"tips":["Grammar: Asha kori (I hope) goes in front of a normal sentence: Asha kori abar dekha hobe = I hope we meet again. For wishes, say Amar iccha, ... or ... iccha ache, and the plan itself often uses the -bo future: Amar iccha, nijer ekta bebsha korbo.","Boro hoye tumi ki hote chao? (What do you want to be when you grow up?) is something every Bangladeshi child is asked, often by relatives and guests.","Inshallah (God willing) is added to almost any hope or plan, by Muslims especially. You'll hear it after many of this unit's sentences.","Shopno means both a dream you have at night and a dream for your life, just like in English.","Cheshta korle shob shombhob (if you try, anything is possible) is an everyday encouragement, often said to students before exams."],"phrases":["s6u08_bhobishshot","s6u08_bebsha","s6u08_asha_kori","s6u08_asha_dekha","s6u08_shopno_bari","s6u08_banglata","s6u08_boro_hoye","s6u08_bidesh","s6u08_cheshta"]},"lessons":[["s6u08_asha_kori","s6u08_asha_dekha","s6u08_bhobishshot","s6u08_cheshta"],["s6u08_bebsha","s6u08_shopno_bari","s6u08_bhobishshot","s6u08_asha_kori","s6u08_cheshta"],["s6u08_boro_hoye","s6u08_daktar","s6u08_porashona","s6u08_cheshta","s6u08_asha_dekha"],["s6u08_bidesh","s6u08_banglata","s6u08_ghure","s6u08_thik_korini","s6u08_porashona","s6u08_shopno_bari"],["s6u08_inshallah","s6u08_shudhu_chai","s6u08_bidesh","s6u08_bebsha","s6u08_boro_hoye"]],"story":"s6u08"},{"id":"s6u09","title":"Because & So","desc":"Give reasons, explain what happened and say why","guide":{"tips":["Grammar: karon (because) comes before the reason: Karon ami notun chakri peyechi. tai (so) comes before the result: Brishti hocchilo, tai ami ashte parini. -er jonno after a noun means \"because of\" or \"for\": jamer jonno (because of the traffic), tomar jonno (for you).","bole after a whole clause also gives a reason, and it is very common in speech: Kaj ache bole ashte parbo na = I have work, so I can't come.","Add -i for emphasis: ei jonno = for this reason, ei jonnoi = exactly for this reason.","Jam (traffic jam) is the classic Dhaka excuse for being late, and everyone accepts it.","You'll also hear jonne instead of jonno, and Dhaka speakers often say ki hoise for ki hoyeche. Understand them, but use the forms taught here."],"phrases":["s6u09_keno_ashoni","s6u09_joruri","s6u09_brishti","s6u09_jam","s6u09_tomar_jonno","s6u09_ki_hoyeche","s6u09_khushi","s6u09_bole","s6u09_ei_jonnoi"]},"lessons":[["s6u09_keno_ashoni","s6u09_joruri","s6u09_ki_hoyeche","s6u09_brishti"],["s6u09_jam","s6u09_shorir","s6u09_ghum","s6u09_keno_ashoni","s6u09_brishti"],["s6u09_tomar_jonno","s6u09_khushi","s6u09_chakri","s6u09_jam","s6u09_joruri"],["s6u09_bole","s6u09_dam","s6u09_tahole","s6u09_shorir","s6u09_chakri"],["s6u09_bondhu_tai","s6u09_ei_jonnoi","s6u09_bole","s6u09_tomar_jonno","s6u09_khushi"]],"story":"s6u09"},{"id":"s6u10","title":"Sorting Out Problems","desc":"Report something broken, make a complaint and clear up a misunderstanding","guide":{"tips":["Grammar: verb + -te hobe means something needs to be done: Eta thik korte hobe = This needs to be fixed. hoye geche means \"has become\" and is how you report that something broke or changed: Fanta noshto hoye geche = The fan has stopped working.","Noshto (broken, spoiled) covers almost anything that stops working: a fan, a phone, a tap, even food that has gone bad.","A mistri is any repairman: electrician, plumber or mechanic. Asking your bariwala (landlord) to send one is everyday life in Bangladesh.","Ashole hoyeche ki... (here's what actually happened...) is the natural way to start explaining your side of a misunderstanding.","Stay polite even when you're annoyed: apni forms, Dukkhito, and a calm Ar jeno emon na hoy get far better results than raising your voice."],"phrases":["s6u10_fan","s6u10_pani","s6u10_mistri","s6u10_thik_korte_hobe","s6u10_kotokkhon","s6u10_bhul_bojhabujhi","s6u10_bhul_bujhechen","s6u10_obhijog","s6u10_jeno"]},"lessons":[["s6u10_fan","s6u10_pani","s6u10_thik_korte_hobe","s6u10_mistri"],["s6u10_kotokkhon","s6u10_ekhoni","s6u10_kono_shomossha","s6u10_fan","s6u10_mistri"],["s6u10_hishab","s6u10_ferot","s6u10_obhijog","s6u10_pani","s6u10_thik_korte_hobe"],["s6u10_bhul_bojhabujhi","s6u10_bolte_chaini","s6u10_bhul_bujhechen","s6u10_kotokkhon","s6u10_hishab"],["s6u10_ashole","s6u10_dukkhito","s6u10_jeno","s6u10_bhul_bojhabujhi","s6u10_obhijog","s6u10_ekhoni"]],"story":"s6u10"}]},{"id":"s7","title":"Section 7 · Intermediate II","desc":"B1 · Reported speech, memories, careers, culture, what-ifs","units":[{"id":"s7u01","title":"He Said That…","desc":"Pass on what people said, asked and told you to do","guide":{"tips":["Grammar: To report speech, say who spoke + bollo / bollen, then (optionally) je, then the words with their ORIGINAL tense: Ma bollo je aj brishti hobe = Mom said (that) it will rain today. For questions use jiggesh korlo and keep the question word: jiggesh korlo tumi kokhon ashbe. For instructions, put the verb in -te before bollo: opekkha korte bollen = told me to wait.","bollo / korlo are the casual \"he/she said / did\" (for friends, younger people, family). bollen / korlen are the respectful forms for elders, doctors and anyone you'd call apni.","je (that) is often dropped in fast speech: Ma bollo aj brishti hobe is just as natural.","Bangla has no he/she distinction: o (casual) and uni (polite) mean either. Context tells you who is meant.","In casual Dhaka speech you'll hear koilo / koise for \"said\". Understand it, but use bollo yourself."],"phrases":["s7u01_ki_bollen","s7u01_ma_bollo","s7u01_bollam","s7u01_daktar","s7u01_jiggesh_kokhon","s7u01_opekkha","s7u01_shunechi","s7u01_dukkhito","s7u01_ke_bollo"]},"lessons":[["s7u01_ki_bollen","s7u01_bolo","s7u01_ma_bollo","s7u01_sumon"],["s7u01_bollam","s7u01_daktar","s7u01_ke_bollo","s7u01_ma_bollo","s7u01_ki_bollen"],["s7u01_jiggesh_kokhon","s7u01_jiggesh_kothay","s7u01_dukkhito","s7u01_sumon","s7u01_bollam"],["s7u01_jante","s7u01_opekkha","s7u01_bolbo","s7u01_jiggesh_kothay","s7u01_daktar"],["s7u01_shunechi","s7u01_bolenni","s7u01_ke_bollo","s7u01_opekkha","s7u01_jante"]],"story":"s7u01"},{"id":"s7u02","title":"Childhood Memories","desc":"Talk about what you used to do when you were young","guide":{"tips":["Grammar: The habitual past (\"used to …\") is the verb stem + -tam for ami/amra, -te for tumi, -ten for apni/uni, -to for o: kortam, korte, korten, korto. A few stems change their vowel: ja → jetam (used to go), kha → khetam (used to eat), pa → petam (used to get).","The same form also covers English \"would\" in memories: Nani golpo shonaten = Grandma would tell us stories.","Chotobelay (in childhood) is the go-to word for starting a memory. Tokhon (back then) keeps the story going.","Shei dingulo khub mone pore literally means \"those days come to mind a lot\" — it's how Bangladeshis say \"I miss those days\".","Many Bangladeshis call their parents Abbu/Ammu (or Abba/Amma); Baba/Ma are common too. Nani/Nanu is mother's mother, Dadi/Dadu is father's mother."],"phrases":["s7u02_grame","s7u02_apni_thakten","s7u02_tumi_bhalobashte","s7u02_cricket","s7u02_nodi","s7u02_nani","s7u02_eid","s7u02_mobile","s7u02_shei_din"]},"lessons":[["s7u02_grame","s7u02_apni_thakten","s7u02_dushtu","s7u02_nodi"],["s7u02_tumi_bhalobashte","s7u02_cricket","s7u02_am","s7u02_grame","s7u02_nodi"],["s7u02_nani","s7u02_bhoot","s7u02_abbu","s7u02_apni_thakten","s7u02_cricket"],["s7u02_borsha","s7u02_eid","s7u02_kanamachi","s7u02_dushtu","s7u02_am"],["s7u02_mobile","s7u02_shei_din","s7u02_nani","s7u02_eid","s7u02_tumi_bhalobashte"]],"story":"s7u02"},{"id":"s7u03","title":"Traveling Bangladesh","desc":"Plan trips to Cox's Bazar, the Sylhet tea gardens and the Sundarbans","guide":{"tips":["Grammar: The -te form of a verb (dekhte, jete, hatte, ghurte) links an action to another word: dekhte chai = want to see, jete koto shomoy lage = how long it takes to go, hatte bhalo lage = it feels good to walk.","Ghurte jawa means going somewhere for fun — sightseeing, a trip, an outing. It's the everyday word for \"to travel\" on holiday.","Cox's Bazar's beach faces west onto the Bay of Bengal, so sunset over the sea is the classic thing to see there.","Sylhet division is tea country, and Sreemangal is known as the tea capital of Bangladesh. The Sundarbans, in the southwest, is the world's largest mangrove forest and home of the Royal Bengal tiger; trips usually go by boat.","Winter (roughly November to February) is the main travel season: dry and cool. Book ahead around holidays."],"phrases":["s7u03_cox","s7u03_sunset","s7u03_sylhet","s7u03_tiger","s7u03_mangrove","s7u03_train","s7u03_dekhar","s7u03_winter","s7u03_jodi"]},"lessons":[["s7u03_cox","s7u03_sunset","s7u03_sylhet","s7u03_srimangal"],["s7u03_tiger","s7u03_mangrove","s7u03_jaini","s7u03_cox","s7u03_sylhet"],["s7u03_khulna","s7u03_guide","s7u03_train","s7u03_mangrove","s7u03_sunset"],["s7u03_cha_hata","s7u03_dekhar","s7u03_good_time","s7u03_srimangal","s7u03_khulna"],["s7u03_winter","s7u03_jodi","s7u03_good_time","s7u03_guide","s7u03_jaini"]],"story":"s7u03"},{"id":"s7u04","title":"Healthy Living","desc":"Talk about exercise, sleep, diet and stress","guide":{"tips":["Grammar: Turn a verb into a noun with -a or -no and use it as the subject: hata (walking), khawa (eating), ghumano (sleeping), rakha (keeping). Then add a comment: Ektu hata bhalo = A little walking is good. Ghumano uchit = (You) should sleep.","Bangladeshis \"eat\" water, tea and cigarettes: pani khawa, cha khawa, sigaret khawa. Drinking anything uses kha-.","Tenshon korben na (\"don't take tension\") is the everyday Bangladeshi way to say \"don't worry\". Chinta korben na means the same.","Beshi kore + verb means \"do plenty of it\": beshi kore pani khaben = drink plenty of water.","Advice to an apni person often uses the polite future: khaben, korben — softer than a direct command."],"phrases":["s7u04_hati","s7u04_chap","s7u04_tenshon","s7u04_beyam","s7u04_ghum_uchit","s7u04_tel","s7u04_dupure","s7u04_sigaret","s7u04_mon"]},"lessons":[["s7u04_hati","s7u04_chap","s7u04_tenshon","s7u04_beyam"],["s7u04_ghum_uchit","s7u04_ghumate","s7u04_chini","s7u04_hati","s7u04_chap"],["s7u04_tel","s7u04_shobji","s7u04_daktar_pani","s7u04_chini","s7u04_beyam"],["s7u04_dupure","s7u04_jim","s7u04_sigaret","s7u04_ghumate","s7u04_tenshon"],["s7u04_halka","s7u04_mon","s7u04_dupure","s7u04_daktar_pani","s7u04_ghum_uchit"]],"story":"s7u04"},{"id":"s7u05","title":"Studies & Careers","desc":"Talk about university, job hunting, interviews and career dreams","guide":{"tips":["Grammar: -te shows purpose: masters korte bidesh jete chai = I want to go abroad (in order) to do a master's. kore after a verb means \"after doing\": porashona shesh kore = after finishing studies.","niye porechi = \"studied (taking) a subject\": orthoniti niye porechi = I studied economics. In conversation people also simply say \"university\" or \"varsity\" instead of bishshobiddaloy.","Chakri hoye geche (\"the job has happened\") is the natural way to say \"I got the job\".","Doa kori (\"I pray\") is how Bangladeshis wish someone luck before an exam or interview.","Good news like a new job or passing exams usually means bringing mishti (sweets) for family, friends and colleagues."],"phrases":["s7u05_khujchi","s7u05_bishoy","s7u05_orthoniti","s7u05_interview_ache","s7u05_kemon_holo","s7u05_obhiggota","s7u05_shesh_kore","s7u05_hoye_geche","s7u05_doa"]},"lessons":[["s7u05_khujchi","s7u05_bishoy","s7u05_orthoniti","s7u05_abedon"],["s7u05_interview_ache","s7u05_kemon_holo","s7u05_obhiggota","s7u05_tin_bochor","s7u05_khujchi"],["s7u05_ora_bollo","s7u05_kagoj","s7u05_beton","s7u05_interview_ache","s7u05_abedon"],["s7u05_shesh_kore","s7u05_shopno","s7u05_bidesh","s7u05_bishoy","s7u05_obhiggota"],["s7u05_hoye_geche","s7u05_doa","s7u05_kemon_holo","s7u05_ora_bollo","s7u05_beton"]],"story":"s7u05"},{"id":"s7u06","title":"Money Matters","desc":"Talk about saving, spending, banks, loans and budgets","guide":{"tips":["Grammar: Add -te hobe to a verb for \"have to\": khulte hobe = (I) have to open, dite hobe = (you) will have to pay. Use -te hoy for things that are always true: bhara dite hoy = the rent has to be paid (every time). The person goes in the -ke form: Amake ... hobe = I have to. Dorkar = it's needed: bajet banano dorkar = we need to make a budget.","Dhar is a personal loan between friends or family: dhar dite parbe? = can you lend? and dhar kora = to borrow. A bank loan is usually just lon; on official papers you will see rin.","Many Bangladeshis avoid interest (shud) for religious reasons. Islamic banks talk about profit (munafa) instead of interest, so don't be surprised if someone asks which kind of bank you use.","Asking someone's salary or savings is more common in Bangladesh than in America, but you can always deflect politely with \"Ei to, cholche\" (getting by).","You will hear both dibo and debo for \"I will give\". Dibo is very common in everyday Bangladesh speech."],"phrases":["s7u06_jomai","s7u06_khoroch","s7u06_account","s7u06_bajet","s7u06_lon","s7u06_shud","s7u06_dhardite","s7u06_ferot","s7u06_mashsheshe"]},"lessons":[["s7u06_jomai","s7u06_khoroch","s7u06_bajet","s7u06_bajeterbaire"],["s7u06_account","s7u06_atm","s7u06_beton","s7u06_jomai","s7u06_khoroch"],["s7u06_dhardite","s7u06_ferot","s7u06_dhar","s7u06_bajet","s7u06_atm"],["s7u06_lon","s7u06_kisti","s7u06_shud","s7u06_account","s7u06_dhar"],["s7u06_mashsheshe","s7u06_khata","s7u06_bhobishshot","s7u06_bajeterbaire","s7u06_ferot","s7u06_lon"]],"story":"s7u06"},{"id":"s7u07","title":"Music, Poetry & Film","desc":"Talk about songs, singers, poets, films and TV dramas","guide":{"tips":["Grammar: Bangla talks about likes as feelings that happen to you. Amar bhalo lage = I like it (it feels good to me); in the past, kemon laglo? = how did you like it? (how did it feel?). For activities you love, add -te bhalobashi: gan shunte bhalobashi = I love listening to music.","Rabindranath Tagore (Robindronath Thakur) wrote thousands of songs, called Robindroshongit. He wrote Bangladesh's national anthem and was the first Asian to win the Nobel Prize in Literature (1913).","Kazi Nazrul Islam is Bangladesh's national poet, often called the \"rebel poet\" (bidrohi kobi). His songs are called Nozrulgiti or Nozrul shongit.","Chobi means both \"picture\" and \"film\"; sinema and movie are common too. Bangla natok (TV dramas), especially the special ones released for Eid, are hugely popular.","To talk respectfully about a famous person, use uni and the respectful verb: Uni bhalo obhinoy koren. Tagore gets peyechilen, not peyechilo."],"phrases":["s7u07_ganshunte","s7u07_priyoshilpi","s7u07_ganta","s7u07_robindro","s7u07_jatiyo","s7u07_nozrul","s7u07_kobita","s7u07_sinema","s7u07_chobita"]},"lessons":[["s7u07_ganshunte","s7u07_priyoshilpi","s7u07_ganta","s7u07_robindro"],["s7u07_nobel","s7u07_jatiyo","s7u07_nozrul","s7u07_ganshunte","s7u07_robindro"],["s7u07_jibonanondo","s7u07_kobita","s7u07_tobla","s7u07_jatiyo","s7u07_ganta"],["s7u07_sinema","s7u07_chobita","s7u07_golpo","s7u07_priyoshilpi","s7u07_kobita"],["s7u07_obhinoy","s7u07_natok","s7u07_sinema","s7u07_golpo","s7u07_nozrul","s7u07_tobla"]],"story":"s7u07"},{"id":"s7u08","title":"Complaints & Polite Pushback","desc":"Complain firmly but politely, ask for a refund or a fix, and stand your ground","guide":{"tips":["Grammar: Small words carry the firmness. Kintu after the subject (Eta kintu thik hocche na) means \"this really isn't right\", and to (Eta to apnader dayitto) means \"after all / you know\". For \"can't\", use -te parbo na (opekkha korte parbo na) or -te parchi na for right now (mene nite parchi na). A polite future question works as a soft request: Dekhben? = Would you look into it?","Start softly and stay calm: Maf korben (excuse me) at the start and Kichu mone korben na (no offense) at the end make a complaint sound reasonable. Raising your voice usually gets you less, not more.","Bujhlam, kintu ... (I understand, but ...) is the classic way to hold your ground without arguing.","Apnader (your, plural) is used when you talk to someone as a representative of a shop or company: apnader dayitto = your company's responsibility.","Keep the receipt (roshid). Many shops will only exchange (bodle dewa) rather than refund, so ask for an exchange first."],"phrases":["s7u08_order","s7u08_thiknai","s7u08_noshto","s7u08_ferot","s7u08_manejar","s7u08_dekhben","s7u08_bujhlam","s7u08_kichumone","s7u08_dayitto"]},"lessons":[["s7u08_order","s7u08_thiknai","s7u08_roshid","s7u08_noshto"],["s7u08_ferot","s7u08_beshitaka","s7u08_bujhlam","s7u08_noshto","s7u08_order"],["s7u08_opekkha","s7u08_manejar","s7u08_dekhben","s7u08_thiknai","s7u08_ferot"],["s7u08_bolechilen","s7u08_shomossha","s7u08_kalker","s7u08_dekhben","s7u08_bujhlam"],["s7u08_dayitto","s7u08_kichumone","s7u08_manejar","s7u08_shomossha","s7u08_beshitaka","s7u08_roshid"]],"story":"s7u08"},{"id":"s7u09","title":"How Things Are Done","desc":"Say what can be done, where things are found, and how things are done in Bangladesh","guide":{"tips":["Grammar: To say what \"can be done\" in general, use the -a form of the verb + jay: kora jay = it can be done, pawa jay = it can be found, dekha jay = it can be seen, jawa jay = you can go. Add na for \"can't\": pawa jay na. Jabe na often means \"not allowed\": chobi tola jabe na = no photos. For \"one has to\", use -te hoy: juta khule dhukte hoy. Bola hoy / banano hoy = is called / is made.","These forms have no person in them, so they are perfect for asking how things work without pointing at anyone: Ekhane ki card diye taka dewa jay?","Etake Banglay ki bola hoy? (What is this called in Bangla?) is one of the most useful questions you can ask. In fast speech people also say Eta ke Banglay ki bole?","Before entering a mosque, or many homes, take off your shoes. Dress modestly, and ask before taking photos of people.","Chal is uncooked rice; bhat is cooked rice. The kachabajar (fresh market) sells vegetables, fish and meat."],"phrases":["s7u09_card","s7u09_boita","s7u09_hete","s7u09_chobitola","s7u09_moshjid","s7u09_banano","s7u09_bolahoy","s7u09_riksha","s7u09_ferot"]},"lessons":[["s7u09_card","s7u09_boita","s7u09_ferot","s7u09_kachabajar"],["s7u09_hete","s7u09_riksha","s7u09_nodi","s7u09_boita","s7u09_card"],["s7u09_chobitola","s7u09_moshjid","s7u09_ekdine","s7u09_hete","s7u09_ferot"],["s7u09_banano","s7u09_chal","s7u09_kiranna","s7u09_kachabajar","s7u09_moshjid"],["s7u09_bolahoy","s7u09_onlaine","s7u09_banano","s7u09_riksha","s7u09_chobitola","s7u09_ekdine"]],"story":"s7u09"},{"id":"s7u10","title":"What If…","desc":"Imagine, regret and wish: what would happen, what would have been better","guide":{"tips":["Grammar: For things that aren't real (wishes, regrets, \"if I were you\"), Bangla reuses the habitual past endings you learned for childhood memories: hoto (would be / would have been), kortam (I would do), korte (you would do, casual), korten (you would do, polite). The \"if\" part takes -le: bolle (if you had said), thakle (if I were), janle (if I had known); or use jodi with the same -to form: jodi taka thakto. The context tells you whether it means now or in the past.","Compare a real possibility: jodi + present or future (Jodi abar shujog pai, abar ashbo = If I get the chance, I'll come again; Ekhon rowna dile ... pouche jabe = If you set off now, you'll get there).","Aro age bolle bhalo hoto (it would have been better if you'd said so earlier) is a very common, gentle way to complain without blaming anyone too hard.","Bhaggish (luckily, thank goodness) and Noile ki je hoto! (otherwise who knows what would have happened!) often come together when someone has saved the day.","Apni jodi ... korten, khub upokar hoto is a very polite way to ask a big favor, much softer than a direct request."],"phrases":["s7u10_bolle","s7u10_prithibi","s7u10_tomarjaygay","s7u10_amarjaygay","s7u10_shikhtam","s7u10_train","s7u10_upokar","s7u10_bhaggish","s7u10_noile"]},"lessons":[["s7u10_prithibi","s7u10_chuti","s7u10_shikhtam","s7u10_shujog"],["s7u10_tomarjaygay","s7u10_amarjaygay","s7u10_moja","s7u10_prithibi","s7u10_chuti"],["s7u10_bolle","s7u10_janle","s7u10_train","s7u10_shikhtam","s7u10_tomarjaygay"],["s7u10_brishti","s7u10_upokar","s7u10_rowna","s7u10_shujog","s7u10_bolle"],["s7u10_bhaggish","s7u10_noile","s7u10_train","s7u10_amarjaygay","s7u10_janle","s7u10_moja"]],"story":"s7u10"}]},{"id":"s8","title":"Section 8 · Fluent","desc":"B2 · Ideas, nuance, idioms, negotiating, formal Bangla","units":[{"id":"s8u01","title":"Discussing Ideas","desc":"Make an argument, push back politely and concede a point","guide":{"tips":["Grammar: To concede a point and still disagree, start with \"Ta thik, kintu…\" (that's true, but…) or \"Jodio…, tobuo…\" (although…, still…). Jodio kothata thik, tobuo bastobe eta kora kothin = Although that's true, it's hard in practice.","Jukti means reasoning or argument. \"Apnar kothay jukti ache\" (there's logic in what you say) is the classic polite way to give ground before you push back.","Torko is an argument in the quarrel sense. Saying you don't want torko, only to understand, keeps a debate friendly.","Dhorun (suppose / let's say, literally \"hold\") sets up a hypothetical. In everyday Dhaka speech you will often hear \"Dhoren\".","The little word to softens or stresses a point: \"onno diktao to bhabte hobe\" = we do have to think about the other side too."],"phrases":["s8u01_jukti_ache","s8u01_onno_dik","s8u01_udahoron","s8u01_dhorun","s8u01_bolte_din","s8u01_bujhte_parchi","s8u01_jodio","s8u01_mene_nilam","s8u01_shohoj_na"]},"lessons":[["s8u01_jukti_ache","s8u01_onno_dik","s8u01_shomossha","s8u01_udahoron"],["s8u01_bolte_din","s8u01_amar_jukti","s8u01_jukti_ache","s8u01_shomossha"],["s8u01_dhorun","s8u01_bujhte_parchi","s8u01_proman","s8u01_onno_dik","s8u01_udahoron"],["s8u01_jodio","s8u01_shohoj_na","s8u01_bishshash","s8u01_amar_jukti","s8u01_dhorun"],["s8u01_dujoner","s8u01_mene_nilam","s8u01_torko","s8u01_jodio","s8u01_bujhte_parchi"]],"story":"s8u01"},{"id":"s8u02","title":"Softening & Nuance","desc":"Hedge, soften and disagree gently: maybe, probably, it seems","guide":{"tips":["Grammar: Put a hedge word before the statement: hoyto (maybe), bodhoy (probably, I guess), shombhoboto (probably, a bit more formal). Mone hocche (it seems) talks about what you sense right now; mone hoy (I think) is a general opinion.","Tobe also means \"but\", yet it sounds softer than kintu: \"Kharap hoyni, tobe aro bhalo hote parto\" criticizes gently.","Kichu mone korben na (literally \"don't think anything of it\") is the all-purpose polite opener: excuse me, if you don't mind, no offense.","Adding -i to a word stresses it in a softening way: bhaloi = nice enough, kothai thik = your words are the right ones after all.","Bangladeshis often avoid a flat \"no\" with a superior or elder. \"Ami thik nishchit na, jene janacchi\" buys time without saying no."],"phrases":["s8u02_hoyto_ashte","s8u02_bodhoy_brishti","s8u02_kothao_bhul","s8u02_kichu_mone","s8u02_shombhoboto","s8u02_parto","s8u02_nishchit","s8u02_mone_hoy_na","s8u02_bolte_chaini"]},"lessons":[["s8u02_hoyto_ashte","s8u02_bodhoy_brishti","s8u02_kichu_mone","s8u02_shombhoboto"],["s8u02_mone_hoy_na","s8u02_shesh_hobe_na","s8u02_hoyto_ashte","s8u02_bodhoy_brishti","s8u02_kichu_mone"],["s8u02_kothao_bhul","s8u02_chaile","s8u02_nishchit","s8u02_kichu_mone","s8u02_shombhoboto"],["s8u02_parto","s8u02_bhaloi","s8u02_nijer_mot","s8u02_kothao_bhul","s8u02_shesh_hobe_na"],["s8u02_shomossha_na_hoy","s8u02_bolte_chaini","s8u02_kothai_thik","s8u02_chaile","s8u02_parto"]],"story":"s8u02"},{"id":"s8u03","title":"Everyday Idioms & Sayings","desc":"Common Bangla idioms and proverbs, with what they really mean","guide":{"tips":["Grammar: Many sayings use the -le form, meaning \"when / if someone does\": chor palale (when the thief runs off), nachte na janle (if you can't dance), bhat chitale (if you scatter rice).","Shorsher moddhei bhut: in folk practice mustard seeds are used to drive ghosts away, so a ghost inside the mustard means the very thing meant to fix a problem is the problem.","Dumurer ful (fig flower): fig flowers are hidden inside the fruit, so nobody sees them. Say it warmly to a friend you haven't seen in ages.","Gaye pore jhogra kora (literally \"falling onto someone's body to quarrel\") means picking a fight nobody asked for. Matha gorom (hot head) = angry; thanda matha (cool head) = calm.","Shobure meowa fole uses older Persian-origin words: shobur = patience, meowa = fruit (especially dried fruit). It's a very common Bangladeshi saying."],"phrases":["s8u03_akash","s8u03_dhil","s8u03_tali","s8u03_matha_gorom","s8u03_nachte","s8u03_dumur","s8u03_shobure","s8u03_chor","s8u03_golay_golay"]},"lessons":[["s8u03_tali","s8u03_dhil","s8u03_dumur","s8u03_probad"],["s8u03_matha_gorom","s8u03_gaye_pore","s8u03_akash","s8u03_tali","s8u03_dumur"],["s8u03_shobure","s8u03_chor","s8u03_nachte","s8u03_dhil","s8u03_matha_gorom"],["s8u03_golay_golay","s8u03_mosh","s8u03_bhat_kak","s8u03_akash","s8u03_nachte"],["s8u03_shorshe","s8u03_oti_chalak","s8u03_probad","s8u03_gaye_pore","s8u03_shobure","s8u03_chor"]],"story":"s8u03"},{"id":"s8u04","title":"Negotiating","desc":"Bargain over price, terms, payment and deadlines at work","guide":{"tips":["Grammar: Verbal noun + jabe says what can be done: dam komano jabe (the price can be lowered), shesh kora jabe? (can it be finished?). It sounds less pushy than asking \"can you…?\".","Kotha paka (the word is ripe / firm) means the deal is settled. Kotha dewa (to give your word) means to promise, so \"kotha dite parchi na\" = I can't commit yet.","Kulabe na means \"won't stretch to cover\". Use it for budgets, time and space: bajete kulabe na = the budget won't cover it.","Bargaining is normal in Bangladeshi business, and it's done with warmth. Mentioning a long-term relationship often gets a better price than pushing hard.","Ogrim (advance payment) is very common for printing, tailoring and repair jobs; half up front is a typical arrangement."],"phrases":["s8u04_beshi_order","s8u04_shesh_dam","s8u04_majhamajhi","s8u04_kulabe_na","s8u04_ogrim","s8u04_ordhek","s8u04_kotha_dite","s8u04_kotha_paka","s8u04_likhito"]},"lessons":[["s8u04_shesh_dam","s8u04_majhamajhi","s8u04_kotha_paka","s8u04_kulabe_na"],["s8u04_kome_dicche","s8u04_beshi_order","s8u04_shesh_dam","s8u04_majhamajhi","s8u04_kulabe_na"],["s8u04_ogrim","s8u04_ordhek","s8u04_payment","s8u04_kotha_paka","s8u04_kulabe_na"],["s8u04_prostab","s8u04_shorte_raji","s8u04_likhito","s8u04_ordhek","s8u04_beshi_order"],["s8u04_ek_shoptaho","s8u04_kotha_dite","s8u04_lomba_shomoy","s8u04_kome_dicche","s8u04_likhito","s8u04_ogrim"]],"story":"s8u04"},{"id":"s8u05","title":"Telling a Story Well","desc":"Build suspense, show emotion and react to a good story","guide":{"tips":["Grammar: Storytellers jump into the present tense at the exciting moment: \"Hothat dekhi…\" (suddenly I see…), \"Pore dekhi…\" (later I find…). It pulls the listener into the scene.","Good listeners keep the story going: \"Ki bolo!\" (no way!), \"Tarpor?\" (and then?), \"Bap re!\" (oh my!). Silence sounds like boredom.","Doubled verbs mean \"while doing\": hashte hashte = while laughing (and laughing). Pete khil dhora (a cramp grabbing your belly) is the usual way to say you laughed until it hurt.","Karent chole gelo (the current went away) is how everyone in Bangladesh says the power went out. You'll also hear \"load shedding\" for scheduled cuts.","Gaye kata dewa (thorns on the body) = goosebumps, from fear, awe or a moving story."],"phrases":["s8u05_tarpor_jano","s8u05_hothat","s8u05_buk","s8u05_ki_bolo","s8u05_bishshash_korbe_na","s8u05_hashte","s8u05_current","s8u05_bap_re","s8u05_kata"]},"lessons":[["s8u05_bishshash_korbe_na","s8u05_shuru_theke","s8u05_tarpor_jano","s8u05_current"],["s8u05_hothat","s8u05_ki_bolo","s8u05_tarpor_jano","s8u05_bishshash_korbe_na","s8u05_current"],["s8u05_buk","s8u05_rokkha","s8u05_bap_re","s8u05_hothat","s8u05_ki_bolo"],["s8u05_biral","s8u05_hashte","s8u05_bariye","s8u05_current","s8u05_buk"],["s8u05_kata","s8u05_bhulbo_na","s8u05_shesh_porjonto","s8u05_biral","s8u05_shuru_theke","s8u05_rokkha"]],"story":"s8u05"},{"id":"s8u06","title":"Community Life","desc":"Meet neighbors, raise local problems, sort out disputes and volunteer","guide":{"tips":["Grammar: Add -le to a verb to mean \"if\" or \"when\": hole (if it happens), korle (if you do), thakle (if someone lives/is), bolle (if we talk). The rest of the sentence says what follows: Kotha bolle mitmat hoye jabe = If we talk, it'll get sorted.","-lei adds \"as soon as / even just\": ektu brishti holei = the moment it rains even a little.","To complain to a neighbor without causing offense, describe what would help instead of blaming: ...kom korle bhalo hoy = it would be nice if... is much softer than a direct command.","Tintolay = on the third floor (tin = three, tola = floor). Notun uthechi = I've just moved in — utha (to rise / go up) is the everyday verb for moving into a home or flat.","Elaka = area / neighborhood. In Dhaka you'll also hear para and mohollah for a local neighborhood."],"phrases":["s8u06_uthechi","s8u06_dorkar","s8u06_awaj","s8u06_mitmat","s8u06_drain","s8u06_abedon","s8u06_ekshathe","s8u06_shahajjo","s8u06_shecchashebok"]},"lessons":[["s8u06_uthechi","s8u06_dorkar","s8u06_khoj","s8u06_awaj"],["s8u06_jhamela","s8u06_mitmat","s8u06_moyla","s8u06_awaj","s8u06_dorkar"],["s8u06_drain","s8u06_rasta","s8u06_abedon","s8u06_moyla","s8u06_jhamela"],["s8u06_ekshathe","s8u06_pahara","s8u06_bonnarto","s8u06_abedon","s8u06_khoj"],["s8u06_shahajjo","s8u06_shecchashebok","s8u06_bonnarto","s8u06_ekshathe","s8u06_uthechi"]],"story":"s8u06"},{"id":"s8u07","title":"Environment & Climate","desc":"Talk about rivers, floods, cyclones, pollution and the changing climate","guide":{"tips":["Grammar: -er karone means \"because of\": jolbayu poribortoner karone = because of climate change. Put -leo on a verb for \"even though\": nishiddho holeo = even though it's banned. Compare -le (if) from the last unit: hole = if it is, holeo = even if / even though it is.","Bonna = flood, ghurnijhor = cyclone, jolaboddhota = waterlogging (streets under standing water after rain) — three words you'll hear on the news every monsoon.","Polithin is what people call thin plastic shopping bags. Bangladesh banned them back in 2002, but they're still everywhere.","The Sundarbans (Shundorbon) is a huge mangrove forest on the southwest coast that Bangladesh shares with India; it's home to the Bengal tiger and helps shield the coast from storm surges.","Ghurnijhor-er shongket = cyclone signal. Coastal areas follow numbered warning signals on the radio and TV, and many villages have concrete cyclone shelters (ashroykendro)."],"phrases":["s8u07_nodi","s8u07_jolbayu","s8u07_gorom","s8u07_ghurnijhor","s8u07_bonna","s8u07_jolaboddhota","s8u07_polithin","s8u07_shocheton"]},"lessons":[["s8u07_nodi","s8u07_bhangon","s8u07_gorom","s8u07_jolbayu"],["s8u07_bongoposhagor","s8u07_ghurnijhor","s8u07_shundorbon","s8u07_nodi","s8u07_jolbayu"],["s8u07_bonna","s8u07_jolaboddhota","s8u07_lona","s8u07_bhangon","s8u07_ghurnijhor"],["s8u07_batash","s8u07_buriganga","s8u07_polithin","s8u07_gorom","s8u07_jolaboddhota"],["s8u07_gach","s8u07_shocheton","s8u07_polithin","s8u07_lona","s8u07_shundorbon"]],"story":"s8u07"},{"id":"s8u08","title":"Technology & the Future","desc":"Talk about AI, phones, online life, scams and the future of work","guide":{"tips":["Grammar: -te hoy means \"one has to\" as a general rule: miliye dekhte hoy = you have to double-check. For a specific future obligation use -te hobe: shobaike shikhte hobe = everyone will have to learn. And -le cholbe na = \"it won't do to...\": bhoy pele cholbe na = we can't afford to be scared.","Tech words are mostly English said the Bangla way: update dewa (to update), video kol, order kora, screen time, OTP. The grammar around them stays Bangla.","Fon kora and fon dewa both mean \"to call\" someone. Video kol kora = to video call.","Scam calls asking for an OTP or PIN, often pretending to be from a bank or mobile-money service, are common — Kauke OTP bolben na is advice you'll hear everywhere.","Na to? at the end of a sentence adds a worried \"...aren't we?\" — it softens a concern into a question: nirbhorshil hoye porchi na to? = we're not getting too dependent, are we?"],"phrases":["s8u08_update","s8u08_ammu","s8u08_ai","s8u08_bhul","s8u08_chakri","s8u08_mone","s8u08_otp","s8u08_nirbhor"]},"lessons":[["s8u08_update","s8u08_chokh","s8u08_ammu","s8u08_online"],["s8u08_ai","s8u08_bhul","s8u08_shikhte","s8u08_update","s8u08_online"],["s8u08_chakri","s8u08_mone","s8u08_freelancing","s8u08_ai","s8u08_shikhte"],["s8u08_otp","s8u08_protarona","s8u08_screen","s8u08_chokh","s8u08_ammu"],["s8u08_future","s8u08_nirbhor","s8u08_mone","s8u08_chakri","s8u08_screen"]],"story":"s8u08"},{"id":"s8u09","title":"Formal Bangla","desc":"Open and close a speech, follow announcements, address an audience politely","guide":{"tips":["Grammar: Formal Bangla swaps everyday words for formal ones and often uses the passive. Bosun becomes ashon grohon korun (take your seats), deri becomes bilombo (delay), and \"we request\" becomes onurodh kora hocche (it is being requested). Apnara is the polite plural \"you all\", and -gon makes a formal plural: jatri (passenger) to jatrigon (passengers).","This is still spoken Bangla (cholito bhasha) — the old written style (sadhu bhasha, with forms like koriyachi) is not used in speeches today.","Speeches in Bangladesh follow a set order: greet the chair (shobhapoti), the chief guest (prodhan otithi) and the audience (uposthito shudhimondoli), then speak, then thank everyone.","Formal classifier -ti replaces casual -ta: trainti (the train) in an announcement, but trainta in conversation.","Tar (তাঁর, with a nasal mark) is the respectful \"his/her\". In formal speech always use the respectful forms for guests and elders."],"phrases":["s8u09_mohoday","s8u09_shudhimondoli","s8u09_shagoto","s8u09_dhonnobad","s8u09_shesh","s8u09_drishti","s8u09_bilombo","s8u09_ashon","s8u09_proshno"]},"lessons":[["s8u09_mohoday","s8u09_shudhimondoli","s8u09_shagoto","s8u09_shesh"],["s8u09_boktobbo","s8u09_dhonnobad","s8u09_bisheshbhabe","s8u09_shudhimondoli","s8u09_shesh"],["s8u09_drishti","s8u09_train","s8u09_bilombo","s8u09_shagoto","s8u09_dhonnobad"],["s8u09_silent","s8u09_ashon","s8u09_jatiyo","s8u09_drishti","s8u09_boktobbo"],["s8u09_proshno","s8u09_asha","s8u09_mohoday","s8u09_ashon","s8u09_bilombo"]],"story":"s8u09"},{"id":"s8u10","title":"Real Conversations","desc":"Catch up with a friend: news, family, work, prices, opinions, plans and goodbyes","guide":{"tips":["Grammar: naki marks hearsay. Inside a sentence it means \"apparently / I hear\": tumi naki notun chakri niyecho = I hear you took a new job. At the end, shotti naki? = really? Adding -i or -ei stresses a word: ashtei hobe = you simply must come, dutoi = both of them, dui dikei = on both sides.","Aj uthi (literally \"today I'll rise\") is the polite, natural way to say you're leaving a visit or a chat.","Fon dewa (to give a phone) is everyday Bangladeshi for \"to call someone\": fon dio = give me a call (casual).","Real conversations jump between topics — family, traffic, prices, work, travel — and Bangladeshis usually ask about your family's health early on. Asking Baba-mar shorir kemon? is warm and expected.","Ei to at the start of an answer is a relaxed \"oh, you know...\" before you say how things are."],"phrases":["s8u10_khobor","s8u10_besto","s <script>
/* =====================================================================
   ENGINE — no need to edit below this line to add content.

/* ---------- small helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuf = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pickOne = a => a[Math.floor(Math.random() * a.length)];
const PUNCT = /[?!.,;:"“”()।]/g;
const tokDisp = s => s.replace(PUNCT, "").split(/\s+/).filter(Boolean);
const toks = s => tokDisp(s).map(t => t.toLowerCase().replace(/[’']/g, ""));
function lev(a, b) { const d = [...Array(b.length + 1).keys()]; for (let i = 1; i <= a.length; i++) { let p = d[0]; d[0] = i; for (let j = 1; j <= b.length; j++) { const t = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, p + (a[i - 1] === b[j - 1] ? 0 : 1)); p = t; } } return d[b.length]; }
const sim = (a, b) => 1 - lev(a, b) / Math.max(a.length, b.length, 1);
const dstr = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const today = () => dstr(new Date());
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return dstr(d); };

/* ---------- content checks (shown on screen if anything is wrong) ---------- */
const PROBLEMS = [];
(function validate() {
  const okId = /^[A-Za-z0-9_]+$/;
  const ens = {};
  for (const [k, it] of Object.entries(ITEMS)) {
    if (!okId.test(k)) PROBLEMS.push(`Item id "${k}" should use only letters, numbers and _`);
    if (!it.rom || !it.bn || !it.en) PROBLEMS.push(`Item "${k}" is missing rom, bn or en`);
    else { const e = it.en.toLowerCase(); if (ens[e]) PROBLEMS.push(`Items "${ens[e]}" and "${k}" have the same English (“${it.en}”)`); ens[e] = k; }
  }
  const unitIds = new Set();
  COURSE.sections.forEach(s => s.units.forEach(u => {
    if (!okId.test(u.id)) PROBLEMS.push(`Unit id "${u.id}" should use only letters, numbers and _`);
    if (unitIds.has(u.id)) PROBLEMS.push(`Duplicate unit id "${u.id}"`);
    unitIds.add(u.id);
    if (!u.lessons || !u.lessons.length) PROBLEMS.push(`Unit "${u.id}" has no lessons`);
    (u.lessons || []).forEach((l, i) => {
      if (l.length < 2) PROBLEMS.push(`${u.id} lesson ${i + 1} needs at least 2 items`);
      l.forEach(id => { if (!ITEMS[id]) PROBLEMS.push(`${u.id} lesson ${i + 1}: unknown item "${id}"`); });
    });
    ((u.guide && u.guide.phrases) || []).forEach(id => { if (!ITEMS[id]) PROBLEMS.push(`${u.id} guidebook: unknown item "${id}"`); });
    if (u.story && !STORIES[u.story]) PROBLEMS.push(`${u.id}: unknown story "${u.story}"`);
  }));
  for (const [k, st] of Object.entries(STORIES)) st.lines.forEach((ln, i) => {
    if (ln.q) { if (!Array.isArray(ln.opts) || !(ln.a >= 0 && ln.a < ln.opts.length)) PROBLEMS.push(`Story "${k}" line ${i + 1}: question needs opts and a valid answer index`); return; }
    if (!st.cast || !st.cast[ln.who]) PROBLEMS.push(`Story "${k}" line ${i + 1}: speaker "${ln.who}" isn't in the cast`);
    if (ln.item) { if (!ITEMS[ln.item]) PROBLEMS.push(`Story "${k}" line ${i + 1}: unknown item "${ln.item}"`); }
    else if (!ln.rom || !ln.bn || !ln.en) PROBLEMS.push(`Story "${k}" line ${i + 1}: needs an item, or rom + bn + en`);
  });
  const missing = new Set();
  Object.values(ITEMS).forEach(it => it.rom && toks(it.rom).forEach(t => { if (!WORDS[t]) missing.add(t); }));
  if (missing.size) console.warn("Words with no tap-hint in WORDS:", [...missing].join(", "));
})();

/* ---------- saved progress ---------- */
const KEY = "banglaSpeak_v4";
const fresh = () => ({done:{}, rev:{}, miss:{}, seen:{}, noSpeakUntil:0, noListenUntil:0, slow:false, sound:true, goal:10, days:{}});
let S;
try { S = Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) { S = fresh(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* Spaced repetition (Leitner boxes): a miss drops a phrase to box 0 (due now);
   a clean session moves it up one box. Days until next review, per box: */
const BOX = [0, 1, 3, 7, 16, 35];
function schedule(id, ok) {
  const r = S.rev[id];
  const box = ok ? (r ? Math.min(r.box + 1, BOX.length - 1) : 1) : 0;
  S.rev[id] = {box, due: addDays(BOX[box])};
  if (ok) delete S.miss[id]; else S.miss[id] = 1;
  S.seen[id] = 1;
}
const strength = id => (S.rev[id] ? S.rev[id].box : 0);
const dueIds = () => Object.keys(S.rev).filter(id => ITEMS[id] && S.rev[id].due <= today());
const seenIds = () => Object.keys(S.seen).filter(id => ITEMS[id]);

/* ---------- course structure ---------- */
const UNITS = COURSE.sections.flatMap(s => s.units);
const unitById = id => UNITS.find(u => u.id === id);
const unitItems = u => [...new Set(u.lessons.flat())].filter(id => ITEMS[id]);
function nodesOf(u) {
  const n = u.lessons.map((_, i) => ({key: `${u.id}:L${i}`, kind: "lesson", i, u}));
  if (u.story && STORIES[u.story]) n.push({key: `${u.id}:story`, kind: "story", u});
  n.push({key: `${u.id}:review`, kind: "review", u});
  return n;
}
const PATH = UNITS.flatMap(nodesOf);
function isUnlocked(key) { const i = PATH.findIndex(n => n.key === key); return i <= 0 || !!S.done[PATH[i - 1].key]; }

/* ---------- audio: text-to-speech + speech recognition ---------- */
let VOICE = null;
function pickVoice() {
  const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  VOICE = vs.find(v => /^bn[-_]BD/i.test(v.lang)) || vs.find(v => /^bn/i.test(v.lang)) || null;
}
/* Recorded voice clips (Azure neural voices). make-voices.bat creates audio/*.mp3 and audio/manifest.js.
   A clip's file name is a hash of "<voice>|<Bangla text>". Missing clips fall back to the browser voice. */
const CLIPS = new Set(window.BS_CLIPS || []);
function fnv(s) { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return ("0000000" + h.toString(16)).slice(-8); }
const clipFor = (text, voice = "f") => [fnv(voice + "|" + text), fnv("f|" + text)].find(id => CLIPS.has(id));
const hasAudio = id => !!VOICE || !!(ITEMS[id] && clipFor(ITEMS[id].bn));
const audioOK = () => !!VOICE || CLIPS.size > 0;
const listenOK = () => audioOK() && Date.now() > S.noListenUntil;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const speakOK = () => !!SR && window.isSecureContext && Date.now() > S.noSpeakUntil;
let PLAYER = null;
function stopAudio() { if (PLAYER) { PLAYER.pause(); PLAYER = null; } if (window.speechSynthesis) speechSynthesis.cancel(); }
function ttsSay(text, slow, pitch) {
  if (!VOICE) return;
  const u = new SpeechSynthesisUtterance(text);
  u.voice = VOICE; u.lang = VOICE.lang; u.pitch = pitch;
  u.rate = slow ? 0.55 : (S.slow ? 0.75 : 0.9);
  speechSynthesis.speak(u);
}
function say(text, {slow = false, pitch = 1, voice = "f"} = {}) {
  stopAudio();
  const clip = clipFor(text, voice);
  if (!clip) return ttsSay(text, slow, pitch);
  const a = new Audio("audio/" + clip + ".mp3");
  a.playbackRate = slow ? 0.7 : (S.slow ? 0.85 : 1);
  a.onerror = () => { if (PLAYER === a) ttsSay(text, slow, pitch); };
  PLAYER = a;
  a.play().catch(() => { if (PLAYER === a) ttsSay(text, slow, pitch); });
}
const sayId = (id, slow) => ITEMS[id] && say(ITEMS[id].bn, {slow});
const audioBtns = id => audioOK() ? `<div class="audio"><button onclick="sayId('${id}')" aria-label="Play">${ICON.speaker}</button><button class="alt" onclick="sayId('${id}',true)" aria-label="Play slowly">Slow</button></div>` : "";
const nbn = s => s.replace(/[\s?!.,।‌‍]/g, "");
function simBn(heard, target) { const a = nbn(heard), b = nbn(target); return a.includes(b) ? 1 : sim(a, b); }

/* ---------- typed answers: forgiving of small romanization differences ---------- */
const loose = s => s.toLowerCase().replace(/[^a-z\s]/g, "").replace(/v/g, "bh").replace(/(.)\1+/g, "$1").replace(/\s+/g, " ").trim();
function checkTyped(id, txt) {
  const it = ITEMS[id], t = loose(txt), tn = t.replace(/ /g, "");
  const answers = [it.rom, ...(it.alt || [])].map(loose);
  if (answers.some(a => a === t || a.replace(/ /g, "") === tn)) return {ok: true};
  const best = Math.max(...answers.map(a => sim(a.replace(/ /g, ""), tn)));
  return best >= 0.8 && tn.length >= 3 ? {ok: true, typo: true} : {ok: false};
}

/* ---------- word hints ---------- */
function hint(rom, on = true) {
  return rom.split(/(\s+)/).map(p => {
    if (!p || /^\s+$/.test(p)) return p;
    const key = toks(p)[0], g = key && WORDS[key];
    return on && g ? `<span class="w" data-g="${esc(g)}">${esc(p)}</span>` : esc(p);
  }).join("");
}
document.addEventListener("click", ev => {
  const tip = $("tip"), w = ev.target.closest(".w");
  if (w) {
    tip.textContent = w.dataset.g; tip.style.display = "block";
    const r = w.getBoundingClientRect();
    tip.style.left = Math.max(8, Math.min(r.left + scrollX, innerWidth - tip.offsetWidth - 8)) + "px";
    tip.style.top = (r.bottom + scrollY + 6) + "px";
  } else tip.style.display = "none";
  const b = ev.target.closest("button"); if (b) b.blur();
});

/* ---------- exercise types ---------- */
// tier 0 = recognize, 1 = assemble, 2 = produce
const T = {
  listenPick:  {tier:0, audio:1},  // hear it, pick the English
  readPick:    {tier:0},           // read it, pick the English
  enPick:      {tier:0},           // English, pick the Bangla
  fill:        {tier:1, multi:1},  // fill in the missing word
  tiles:       {tier:1, multi:1},  // English, build the Bangla from word tiles
  listenTiles: {tier:1, multi:1, audio:1}, // hear it, build it from tiles
  typeEn:      {tier:2},           // English, type the Bangla
  typeHear:    {tier:2, audio:1},  // hear it, type it
  speak:       {tier:2, speak:1}   // say it out loud
};
function eligible(type, id) {
  const d = T[type], it = ITEMS[id];
  if (d.multi && toks(it.rom).length < 2) return false;
  if (d.audio && (!listenOK() || !hasAudio(id))) return false;
  if (d.speak && !speakOK()) return false;
  return true;
}
function chooseType(id, w, last, only) {
  const pool = Object.keys(T).filter(t => eligible(t, id) && (!only || only.includes(t)));
  if (!pool.length) return only ? null : "readPick";
  const ws = pool.map(t => (w[T[t].tier] || 0) * (t === last ? 0.25 : 1));
  const tot = ws.reduce((a, b) => a + b, 0);
  if (tot <= 0) return pickOne(pool);
  let r = Math.random() * tot;
  for (let i = 0; i < pool.length; i++) { r -= ws[i]; if (r <= 0) return pool[i]; }
  return pool[pool.length - 1];
}
function others(id, pool) {
  const near = shuf(pool.filter(k => k !== id && ITEMS[k]));
  const far = shuf(Object.keys(ITEMS).filter(k => k !== id && !pool.includes(k)));
  return [...near, ...far];
}
function distinctField(ids, field, exclude, n) {
  const out = [], used = new Set([exclude.toLowerCase()]);
  for (const k of ids) { const v = ITEMS[k][field]; if (!used.has(v.toLowerCase())) { used.add(v.toLowerCase()); out.push(v); } if (out.length >= n) break; }
  return out;
}
function extraTokens(ids, avoid, n) {
  const low = new Set(avoid.map(t => t.toLowerCase())), out = [];
  for (const k of ids) {
    for (const t of tokDisp(ITEMS[k].rom)) { const l = t.toLowerCase(); if (!low.has(l)) { low.add(l); out.push(t); } }
    if (out.length >= n) break;
  }
  return out.slice(0, n);
}
function makeEx(type, id, pool) {
  const it = ITEMS[id], e = {type, id}, oth = others(id, pool);
  if (type === "listenPick" || type === "readPick") { e.ans = it.en; e.opts = shuf([it.en, ...distinctField(oth, "en", it.en, 3)]); }
  else if (type === "enPick") { e.ans = it.rom; e.opts = shuf([it.rom, ...distinctField(oth, "rom", it.rom, 3)]); }
  else if (type === "tiles" || type === "listenTiles") { e.ans = tokDisp(it.rom); e.bank = shuf([...e.ans, ...extraTokens(oth, e.ans, 3)]); }
  else if (type === "fill") {
    e.tk = tokDisp(it.rom);
    let cand = e.tk.map((_, i) => i).filter(i => e.tk[i].length > 1);
    if (!cand.length) cand = e.tk.map((_, i) => i);
    e.bi = pickOne(cand); e.ans = e.tk[e.bi];
    e.opts = shuf([e.ans, ...extraTokens(oth, e.tk, 2)]);
  }
  return e;
}
function makeMatch(ids) {
  const pick = [], ro = new Set(), en = new Set();
  for (const id of ids) { const it = ITEMS[id]; if (!it || ro.has(it.rom) || en.has(it.en)) continue; ro.add(it.rom); en.add(it.en); pick.push(id); if (pick.length >= 5) break; }
  return pick.length >= 3 ? {type: "match", ids: pick, left: shuf(pick), right: shuf(pick)} : null;
}
function spread(ids, count) { // a sequence of ids, cycled and shuffled, no back-to-back repeats
  const out = []; let bag = [];
  while (out.length < count && ids.length) {
    if (!bag.length) bag = shuf(ids);
    let k = bag.findIndex(x => x !== out[out.length - 1]); if (k < 0) k = 0;
    out.push(bag.splice(k, 1)[0]);
  }
  return out;
}
function buildMixed(order, w, pool, only) {
  const ex = []; let last = null;
  for (const id of order) { const t = chooseType(id, w, last, only); if (!t) continue; ex.push(makeEx(t, id, pool)); last = t; }
  return ex;
}
function insertMatch(ex, ids, pos) { const m = makeMatch(ids); if (m) ex.splice(Math.min(pos, ex.length), 0, m); }

/* ---------- session builders ---------- */
function buildLesson(u, li) {
  const items = u.lessons[li].filter(id => ITEMS[id]), n = u.lessons.length, p = n > 1 ? li / (n - 1) : 0.5;
  const w = [1.4 - p * 0.9, 0.5 + p * 0.7, 0.1 + p * 1.1]; // later lessons lean on harder exercise types
  const earlier = [...new Set(u.lessons.slice(0, li).flat())].filter(id => ITEMS[id] && !items.includes(id));
  const pool = [...new Set([...items, ...earlier])];
  const ex = [];
  items.filter(id => !S.seen[id]).forEach(id => { ex.push({type: "intro", id}); ex.push(makeEx(chooseType(id, [1, 0.15, 0], null), id, pool)); });
  const introLen = ex.length, rest = Math.max(6, 12 - ex.length);
  ex.push(...buildMixed(spread([...items, ...items, ...shuf(earlier).slice(0, 2)], rest), w, pool));
  insertMatch(ex, shuf(pool), introLen + Math.floor(rest / 2));
  return {ex, pool};
