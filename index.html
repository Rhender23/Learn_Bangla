  const it = ITEMS[e.id];
  let msg;
  if (e.type === "match") msg = `<h4>All matched!</h4>`;
  else if (ok) msg = `<h4>${note ? "Correct" : pickOne(["Nice!", "Correct!", "Great job!", "Well done!"])}</h4>${note ? `<div class="sub">${note}</div>` : ""}<div><b>${esc(it.rom)}</b> · ${esc(it.en)}</div>`;
  else msg = `<h4>${retry ? "Correct answer:" : "Let's move on. The phrase was:"}</h4><div><b>${esc(it.rom)}</b> · ${esc(it.en)}</div>`;
  const over = R.opts.legend && R.wrong > LEGEND_MAX;
  setSheet(`<div class="msg">${msg}</div>${e.type !== "match" && audioOK() ? `<button class="alt" onclick="sayId('${e.id}')" aria-label="Play">${ICON.speaker}</button>` : ""}<button id="primary" onclick="${over ? "legendFail()" : "nextEx()"}">Continue</button>`, ok ? "ok" : "bad");
  (ok ? SND.ok : SND.bad)();
  if (e.type !== "match" && e.type !== "speak") setTimeout(() => { if (R && R.ex[R.i] === e) sayId(e.id); }, 380);
}
function nextEx() { if (!R) return; R.i++; window.scrollTo(0, 0); renderEx(); }
function replaceRemaining(pred) {
  for (let j = R.i; j < R.ex.length; j++) {
    const e = R.ex[j];
    if (e.type !== "match" && e.type !== "intro" && pred(e)) R.ex[j] = {...makeEx(chooseType(e.id, [0.6, 1, 1], null), e.id, R.pool), rq: e.rq};
  }
}
function pauseListen() { S.noListenUntil = Date.now() + 3600e3; save(); stopAudio(); replaceRemaining(e => T[e.type] && T[e.type].audio); renderEx(); }
function pauseSpeak() { S.noSpeakUntil = Date.now() + 3600e3; save(); replaceRemaining(e => e.type === "speak"); renderEx(); }
function setMic(msg, on) { const m = $("micmsg"), b = $("mic"); if (m) m.textContent = msg; if (b) b.classList.toggle("on", !!on); }
function startListen() {
  if (!R || R.done || R.listening) return;
  const e = R.ex[R.i], target = ITEMS[e.id].bn;
  let rec;
  try { rec = new SR(); } catch (err) { setMic("Speech recognition isn't available here."); return; }
  rec.lang = "bn-BD"; rec.interimResults = false; rec.maxAlternatives = 5;
  R.listening = true; setMic("Listening…", true);
  rec.onresult = ev => {
    if (!R || R.ex[R.i] !== e) return;
    R.listening = false; setMic("", false);
    const best = Math.max(...[...ev.results[0]].map(a => simBn(a.transcript, target)));
    if (best >= 0.65) grade(true);
    else if (++R.tries >= 3) grade(false, {retry: false});
    else setMic(`Not quite. Listen again and retry (${3 - R.tries} left).`);
  };
  rec.onerror = ev => {
    if (!R) return;
    R.listening = false;
    const m = ev.error === "not-allowed" || ev.error === "service-not-allowed" ? "Microphone is blocked. Allow mic access for this site, or tap “Can't speak now”."
      : ev.error === "no-speech" ? "Didn't hear anything. Tap the mic and try again."
      : ev.error === "network" ? "Speech check needs an internet connection."
      : `Speech check failed (${ev.error}). Try again.`;
    setMic(m, false);
  };
  rec.onend = () => { if (R && R.listening) { R.listening = false; setMic("Tap the mic and speak", false); } };
  rec.start();
}
function askQuit() {
  modal(`<h2>Quit this session?</h2><p>Your progress in this session won't be saved.</p><div class="row"><button class="alt" onclick="closeModal()">Keep going</button><button onclick="closeModal();quitSession()">Quit</button></div>`);
}
function quitSession() { const back = (R && R.opts.back) || (ST && ST.back) || "home"; stopAudio(); logTime((R || ST || {}).t0); R = null; ST = null; back === "hub" ? hub() : home(); }
function applyResults(r) { for (const [id, ok] of Object.entries(r.results)) schedule(id, ok); }
function summary({icon, iconCls = "", title, subtitle, stats, goalHit, body = ""}) {
  return `<div class="done-head"><div class="done-icon ${iconCls}">${icon}</div><h2>${esc(title)}</h2>${subtitle ? `<p class="sub">${esc(subtitle)}</p>` : ""}</div>
    <div class="stats">${stats.map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join("")}</div>
    ${goalHit ? `<div class="goalmsg">${ICON.flame.replace("<svg", '<svg width="20" height="20" fill="var(--gold)"')}You reached today's ${S.goal}-minute goal.</div>` : ""}${body}`;
}
function finishSession() {
  const r = R; R = null;
  applyResults(r);
  if (r.opts.doneKey) S.done[r.opts.doneKey] = true;
  const secs = Math.min((Date.now() - r.t0) / 1000, 20 * 60), goalHit = logTime(r.t0);
  save(); bodyMode(false); stopAudio(); SND.done(); window.scrollTo(0, 0);
  const total = r.right + r.wrong, acc = total ? Math.round(100 * r.right / total) : 100;
  const missed = Object.keys(r.results).filter(id => r.results[id] === false);
  let body = "";
  if (r.newIds.length) body += `<div class="card"><b>New phrases</b>${r.newIds.map(id => phraseRow(id)).join("")}</div>`;
  if (missed.length) body += `<div class="card"><div class="row"><b>Worth another look</b><button class="ghost" onclick="practiceIds(['${missed.join("','")}'], '${r.opts.back}')">Practice these now</button></div>${missed.map(id => phraseRow(id)).join("")}</div>`;
  else body += `<p class="center sub">No phrases missed. Clean run.</p>`;
  $("app").innerHTML = summary({icon: r.opts.legend ? ICON.legend : ICON.done, iconCls: r.opts.legend ? "legend" : "", title: r.opts.legend ? "Legendary complete" : `${r.opts.title} complete`, subtitle: r.opts.unit || "", stats: [[`${acc}%`, "Accuracy"], [fmtTime(secs), "Time"], [r.newIds.length || Object.keys(r.results).length, r.newIds.length ? "New phrases" : "Phrases"]], goalHit, body});
  setSheet(`<span></span><button id="primary" onclick="${r.opts.back === "hub" ? "hub()" : "home()"}">Continue</button>`);
}
function practiceIds(ids, back) {
  const seen = seenIds(), ex = buildMixed(spread(ids, Math.max(ids.length * 2, 4)), [0.6, 1, 1], seen.length ? seen : ids);
  startSession(ex, seen, {title: "Review", back: back || "home"});
}
function legendFail() {
  const r = R; R = null;
  applyResults(r); logTime(r.t0); save(); bodyMode(false); stopAudio(); window.scrollTo(0, 0);
  $("app").innerHTML = summary({icon: ICON.legend, iconCls: "soft", title: "Not quite Legendary", subtitle: `Legendary allows ${LEGEND_MAX} mistakes. Practice your weakest phrases, then try again.`, stats: [[`${r.right}`, "Correct"], [`${r.wrong}`, "Mistakes"], [`${LEGEND_MAX}`, "Allowed"]]});
  setSheet(`<button class="alt" onclick="home()">Back to path</button><button id="primary" onclick="startLegend('${r.opts.uid}')">Try again</button>`);
}

/* ---------- stories ---------- */
function startStory(key, doneKey, back) {
  ST = {key, st: STORIES[key], i: 0, doneKey, back, revealed: {}, right: 0, qs: 0, sel: null, t0: Date.now()};
  CUR = "story"; bodyMode(true); window.scrollTo(0, 0); renderStory();
}
const lineData = ln => ln.item ? ITEMS[ln.item] : ln;
function renderStory() {
  if (!ST) return;
  const {st, i} = ST, lines = st.lines;
  if (i >= lines.length) return finishStory();
  const cur = lines[i];
  let h = `<div class="top"><button class="alt" onclick="askQuit()" aria-label="Quit">✕</button><div class="bar"><div style="width:${Math.round(100 * i / lines.length)}%"></div></div></div><div class="kind">Story</div><h2>${esc(st.title)}</h2><div class="chat">`;
  for (let k = 0; k <= i; k++) {
    const ln = lines[k]; if (ln.q) continue;
    const d = lineData(ln);
    h += `<div class="bub ${ln.who === "b" ? "b" : ""}" onclick="storyReveal(${k})"><div class="who">${esc(st.cast[ln.who])}</div><div>${hint(d.rom)}</div>${ST.revealed[k] ? `<div class="en">${esc(d.en)}</div>` : ""}</div>`;
  }
  h += `</div>`;
  if (cur.q) {
    h += `<div class="card"><div class="prompt">${esc(cur.q)}</div>${cur.opts.map((o, j) => `<button class="opt" data-i="${j}" onclick="storyPick(${j})"><span class="n">${j + 1}</span> ${esc(o)}</button>`).join("")}</div>`;
    setSheet(`<span></span><button id="primary" disabled onclick="storyCheck()">Check</button>`);
  } else {
    setSheet(`<span class="msg sub">Tap a line to see the English.</span>${audioOK() ? `<button class="alt" onclick="storySay(${i})" aria-label="Play">${ICON.speaker}</button>` : ""}<button id="primary" onclick="storyNext()">Continue</button>`);
    setTimeout(() => ST && ST.i === i && storySay(i), 250);
  }
  $("app").innerHTML = h;
  window.scrollTo(0, document.body.scrollHeight);
}
function storySay(k) { const ln = ST.st.lines[k]; if (!ln || ln.q) return; say(lineData(ln).bn, {pitch: ln.who === "a" ? 0.85 : 1.15, voice: (ST.st.voices || {})[ln.who] || "f"}); }
function storyReveal(k) { ST.revealed[k] = !ST.revealed[k]; const y = scrollY; renderStoryKeep(); window.scrollTo(0, y); }
function renderStoryKeep() { const sel = ST.sel; renderStory(); if (sel != null && ST.st.lines[ST.i].q) storyPick(sel); }
function storyPick(j) { ST.sel = j; document.querySelectorAll("#app .opt").forEach(b => b.classList.toggle("sel", +b.dataset.i === j)); $("primary").disabled = false; }
function storyCheck() {
  const cur = ST.st.lines[ST.i]; if (ST.sel == null) return;
  const ok = ST.sel === cur.a; ST.qs++; if (ok) ST.right++; (ok ? SND.ok : SND.bad)();
  document.querySelectorAll("#app .opt").forEach((b, j) => { b.disabled = true; if (j === cur.a) b.classList.add("ok"); else if (j === ST.sel) b.classList.add("bad"); });
  setSheet(`<div class="msg"><h4>${ok ? "Correct!" : "The answer was:"}</h4>${ok ? "" : `<div>${esc(cur.opts[cur.a])}</div>`}</div><button id="primary" onclick="storyNext()">Continue</button>`, ok ? "ok" : "bad");
}
function storyNext() { if (!ST) return; ST.i++; ST.sel = null; renderStory(); }
function finishStory() {
  const s = ST; ST = null;
  if (s.doneKey) S.done[s.doneKey] = true;
  const secs = Math.min((Date.now() - s.t0) / 1000, 20 * 60), goalHit = logTime(s.t0);
  save(); bodyMode(false); stopAudio(); SND.done(); window.scrollTo(0, 0);
  const lines = s.st.lines.filter(l => !l.q).length;
  $("app").innerHTML = summary({icon: ICON.story, iconCls: "story", title: "Story complete", subtitle: s.st.title, stats: [[s.qs ? `${s.right}/${s.qs}` : "–", "Questions"], [fmtTime(secs), "Time"], [lines, "Lines heard"]], goalHit});
  setSheet(`<span></span><button id="primary" onclick="${s.back === "hub" ? "hub()" : "home()"}">Continue</button>`);
}

/* ---------- PRACTICE HUB ---------- */
function hub() {
  CUR = "hub"; R = null; ST = null; bodyMode(false); setSheet(""); navOn("hub");
  const seen = seenIds(), miss = Object.keys(S.miss).filter(id => ITEMS[id]), due = dueIds();
  const card = (title, desc, fn, dis) => `<div class="card row" style="flex-wrap:nowrap"><div><b>${title}</b><div class="sub">${desc}</div></div><button ${dis ? "disabled" : ""} onclick="${fn}">Start</button></div>`;
  let h = banners() + goalCard() + `<h2>Practice</h2>`;
  if (!seen.length) h += `<div class="card">Finish your first lesson to unlock practice.</div>`;
  h += card("Fix mistakes", `${miss.length} phrase${miss.length === 1 ? "" : "s"} you've missed recently`, "practice('miss')", !miss.length);
  h += card("Review due", `${due.length} phrase${due.length === 1 ? "" : "s"} due today`, "practice('due')", !due.length);
  h += card("Weakest phrases", "Drill the phrases you know least", "practice('weak')", seen.length < 2);
  h += card("Listening", "Audio-only exercises", "practice('listen')", !seen.length || !listenOK());
  h += card("Speaking", "Say phrases out loud", "practice('speak')", !seen.length || !speakOK());
  const stories = UNITS.filter(u => u.story && STORIES[u.story] && S.done[`${u.id}:story`]);
  if (stories.length) h += `<h2>Stories</h2>` + stories.map(u => `<div class="card row" style="flex-wrap:nowrap"><b>${esc(STORIES[u.story].title)}</b><button class="alt" onclick="startStory('${u.story}',null,'hub')">Replay</button></div>`).join("");
  const now = Date.now();
  const cal = Array.from({length: 28}, (_, i) => i - 27).map(o => { const k = dayKey(o); return `<i class="${dayState(k)} ${o === 0 ? "t" : ""}" title="${k}${S.days[k] ? " · " + Math.round(S.days[k] / 60) + " min" : ""}"></i>`; }).join("");
  const practiced = Object.values(S.days).filter(v => v > 0).length;
  h += `<h2>Daily goal</h2><div class="card">
    <div class="row"><span>Minutes a day</span><div class="seg">${[0, 5, 10, 15, 20].map(m => `<button class="${S.goal === m ? "on" : ""}" onclick="S.goal=${m};save();hub()">${m ? m : "Off"}</button>`).join("")}</div></div>
    <p class="sub" style="margin:12px 0 0">Last 4 weeks · ${practiced} day${practiced === 1 ? "" : "s"} practiced in total</p><div class="cal">${cal}</div></div>`;
  h += `<h2>Save your progress</h2><div class="card">
    <p class="sub" style="margin-top:0">Progress is stored in this browser. Download a backup to keep it safe or move it to another device.${S.lastBackup ? ` Last backup: ${S.lastBackup}.` : ""}</p>
    <div class="row" style="justify-content:flex-start"><button onclick="backup()">Download backup</button><button class="alt" onclick="$('restoreFile').click()">Restore from backup</button></div>
    <input type="file" id="restoreFile" accept=".json,application/json" style="display:none" onchange="restoreFile(this)"></div>`;
  h += `<h2>Settings</h2><div class="card">
    <div class="row"><span>Sound effects</span><button class="alt" onclick="S.sound=!S.sound;save();hub()">${S.sound ? "On" : "Off"}</button></div>
    <div class="row" style="margin-top:10px"><span>Slower audio</span><button class="alt" onclick="S.slow=!S.slow;save();hub()">${S.slow ? "On" : "Off"}</button></div>
    ${now < S.noListenUntil ? `<div class="row" style="margin-top:10px"><span>Listening exercises paused</span><button class="alt" onclick="S.noListenUntil=0;save();hub()">Turn back on</button></div>` : ""}
    ${now < S.noSpeakUntil ? `<div class="row" style="margin-top:10px"><span>Speaking exercises paused</span><button class="alt" onclick="S.noSpeakUntil=0;save();hub()">Turn back on</button></div>` : ""}
    <p class="sub">Voice: ${CLIPS.size ? CLIPS.size + " recorded clips" : VOICE ? esc(VOICE.name + " (" + VOICE.lang + ")") : "no Bangla voice found"}. Speech check: ${SR ? "available" : "not available"}.</p>
    <button class="alt" onclick="askReset()">Reset all progress</button></div>`;
  if (seen.length) h += `<h2>Your phrases (${seen.length})</h2><div class="card">${[...seen].sort((a, b) => strength(a) - strength(b)).map(id => phraseRow(id, true)).join("")}</div>`;
  $("app").innerHTML = h;
}
function practice(kind) {
  const seen = seenIds();
  let ids = [], count = 12, only = null, title = "Practice";
  if (kind === "miss") { ids = Object.keys(S.miss).filter(id => ITEMS[id]); title = "Fix mistakes"; }
  else if (kind === "due") { ids = dueIds(); title = "Review"; }
  else if (kind === "weak") { ids = [...seen].sort((a, b) => strength(a) - strength(b)).slice(0, 8); title = "Weakest phrases"; }
  else if (kind === "listen") { ids = seen; only = ["listenPick", "listenTiles", "typeHear"]; count = 10; title = "Listening"; }
  else if (kind === "speak") { ids = seen; only = ["speak"]; count = 8; title = "Speaking"; }
  if (!ids.length) return;
  const ex = buildMixed(spread(ids, Math.min(count, Math.max(ids.length * 2, 4))), [0.5, 1, 1], seen, only);
  if (!only && ids.length >= 3) insertMatch(ex, shuf(ids), Math.floor(ex.length / 2));
  startSession(ex, seen, {title, back: "hub"});
}
function backup() {
  S.lastBackup = today(); save();
  const blob = new Blob([JSON.stringify({app: "bangla-speak", version: 1, saved: new Date().toISOString(), data: S}, null, 1)], {type: "application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `bangla-speak-backup-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  hub();
}
let RESTORE = null;
function restoreFile(input) {
  const f = input.files && input.files[0]; input.value = "";
  if (!f) return;
  f.text().then(t => {
    let o = null; try { o = JSON.parse(t); } catch (e) {}
    if (!o || o.app !== "bangla-speak" || !o.data || typeof o.data.done !== "object") {
      modal(`<h2>That file isn't a Bangla Speak backup</h2><p>Choose the file you downloaded, named like bangla-speak-backup-${today()}.json.</p><div class="row"><span></span><button onclick="closeModal()">OK</button></div>`); return;
    }
    RESTORE = o.data;
    const n = Object.keys(o.data.done).length;
    modal(`<h2>Restore this backup?</h2><p>Saved ${esc((o.saved || "").slice(0, 10))} with ${n} completed step${n === 1 ? "" : "s"}. It replaces the progress in this browser.</p><div class="row"><button class="alt" onclick="closeModal()">Cancel</button><button onclick="doRestore()">Restore</button></div>`);
  });
}
function doRestore() { if (!RESTORE) return; S = Object.assign(fresh(), RESTORE); RESTORE = null; save(); closeModal(); home(); }
function askReset() {
  modal(`<h2>Reset all progress?</h2><p>This clears your completed lessons, review schedule and mistakes. It can't be undone.</p><div class="row"><button class="alt" onclick="closeModal()">Cancel</button><button style="background:var(--r)" onclick="closeModal();S=fresh();save();home()">Reset progress</button></div>`);
}

/* ---------- keyboard: Enter = Check/Continue, 1–4 = pick an option ---------- */
document.addEventListener("keydown", ev => {
  if ($("modal").innerHTML) { if (ev.key === "Escape") closeModal(); return; }
  const tag = document.activeElement && document.activeElement.tagName;
  if (ev.key === "Enter" && tag !== "BUTTON") { const p = $("primary"); if (p && !p.disabled) { ev.preventDefault(); p.click(); } }
  else if (/^[1-9]$/.test(ev.key) && tag !== "INPUT") { const b = document.querySelector(`#app .opt[data-i="${+ev.key - 1}"]`); if (b && !b.disabled) b.click(); }
});

/* ---------- start ---------- */
if (window.speechSynthesis) {
  pickVoice();
  speechSynthesis.onvoiceschanged = () => { const had = !!VOICE; pickVoice(); if (had !== !!VOICE && (CUR === "home" || CUR === "hub")) (CUR === "home" ? home : hub)(); };
}
home();
</script>
</body>
</html>
